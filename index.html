<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hibbs (.org.uk)</title>
    <link rel="stylesheet" href="/styles-site.css">
</head>
<body>

    <nav class="menu">
        <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false" aria-controls="menuList">
            <span></span><span></span><span></span>
        </button>
        <ul class="menu-list" id="menuList" hidden>
            <li><a href="para.html">DZ Wind Forecast</a></li>
            <li><a href="sports.html">Football Tracker</a></li>
        </ul>
    </nav>

    <main class="logo-container">
        <img src="logo.jpg" width="615" height="180" alt="Hibbs site logo">
        <div class="posted"></div>
    </main>

    <script>
        const toggle = document.getElementById('menuToggle');
        const list = document.getElementById('menuList');

        function setMenu(open) {
            toggle.setAttribute('aria-expanded', open);
            list.hidden = !open;
        }

        toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            setMenu(list.hidden);
        });
        document.addEventListener('click', (e) => {
            if (!list.contains(e.target)) setMenu(false);
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') setMenu(false);
        });
    </script>

</body>
</html>
