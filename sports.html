<style>
:root{color-scheme:dark;--bg:#06130c;--card:#0e2118;--card2:#13291d;--tx:#eef5f0;--mu:#8fb3a0;--bd:#1f3d2c;--menu-ink:#eef5f0;--menu-accent:#4ade80;--menu-glass:rgba(10,30,20,.78);--menu-line:rgba(255,255,255,.13);--menu-hover:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:pan-x pan-y}   /* no pinch or double-tap zoom */
body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,#14402a 0,var(--bg) 70%) no-repeat,var(--bg);color:var(--tx);font:16px/1.4 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;min-height:100dvh}

h1{font-family:"Bricolage Grotesque","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:clamp(20px,5.9vw,26px);white-space:nowrap;margin:0;letter-spacing:-.02em;text-align:center;line-height:1.1}
.month{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:22px 2px 10px}
/* Phone: two columns, the four WSL teams down the right-hand side. */
.chips{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);grid-auto-flow:row;gap:8px;margin-bottom:4px}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 13px 6px 6px;border-radius:999px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:background-color .15s ease,border-color .15s ease,transform .15s ease}
@media (hover:hover){.chip:not([aria-pressed="true"]):hover{background:var(--card2);border-color:var(--menu-accent);transform:translateY(-1px)}}
.chip:focus-visible{outline:2px solid var(--menu-accent);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--tx);color:#06130c;border-color:var(--tx)}
.chip.all{padding-left:14px}
.crest{position:relative;flex:none;width:var(--s,28px);height:var(--s,28px);border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:calc(var(--s,28px)*.38);overflow:hidden}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12%;background:#fff}
.crest.has span{display:none}
.crest img.flag{padding:0;object-fit:cover}
/* Women's / men's: a faint pink or blue glow in the card's bottom-right corner */
.card.gw::after,.card.gm::after,.hero.gw::after,.hero.gm::after{content:"";position:absolute;right:-50px;bottom:-50px;width:230px;height:230px;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,var(--gl),transparent)}
.card.gw{--gl:rgba(255,120,190,.22)}
.card.gm{--gl:rgba(90,160,255,.22)}
.hero.gw{--gl:rgba(255,120,190,.28)}
.hero.gm{--gl:rgba(90,160,255,.28)}
.ch .cal{margin-left:auto;display:inline-grid;place-items:center;width:36px;height:30px;padding:0;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--mu);cursor:pointer;transition:background-color .15s ease,color .15s ease}
.ch .cal svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.ch .cal:focus-visible{outline:2px solid var(--menu-accent);outline-offset:2px}
.tzbar{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 0;font-size:13px;color:var(--mu)}
.tzbar[hidden]{display:none}
.tzbar .seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--bd);background:var(--card)}
.tzbar button{border:0;border-radius:999px;padding:5px 13px;background:transparent;color:var(--mu);font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.tzbar button[aria-pressed="true"]{background:var(--tx);color:#06130c}
.tzbar button:focus-visible{outline:2px solid var(--menu-accent);outline-offset:2px}
.empty span{display:block;margin-top:6px;opacity:.85}
.ses{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.ses li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:15px;font-weight:600}
.ses time{color:var(--mu);font-weight:700}
.ses li.done{opacity:.5}
.card{position:relative;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--card)) 0,var(--card) 55%);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--c),var(--c2,var(--c)))}

.top{display:flex;align-items:center;gap:10px}
.who{min-width:0;flex:1}

.v{color:var(--mu);font-size:.75em;font-weight:600}
.meta{font-size:13px;color:var(--mu)}
.ch{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.b{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--bc,#21402f);color:var(--bt,#fff);border:1px solid rgba(255,255,255,.1)}
.b img{height:16px;max-width:44px;object-fit:contain}

.live{color:#ff6b5e;font-weight:700}

.stale{margin:12px 0 0}
.stale:empty{display:none}
.hero{position:relative;overflow:hidden;margin-top:18px;padding:16px 16px 14px 20px;border:1px solid var(--bd);border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 38%,var(--card)) 0,var(--card) 70%)}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--c),var(--c2,var(--c)))}
.hk{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--mu)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 2px}
.hcount{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hsub{font-size:14px;color:var(--mu);margin-bottom:10px}
.hvs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.upd{color:var(--mu);font-size:12px;text-align:center;margin:24px 0 0;opacity:.85}
.upd.warn{color:#f5b74a;opacity:1}
/* Team buttons: equal-width grid, two columns on phones, four on computer-sized screens. */
.chip{width:100%;min-width:0;justify-content:flex-start;padding:7px 12px 7px 7px;overflow:hidden}
.chip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.all{justify-content:center;padding-left:12px}
/* Phone: All across the top, then four buttons: F1 and WSL on one row, National and Man City below.
   WSL and National are group buttons (they select several teams at once) and only exist on the phone layout;
   the single-team buttons (.ind) only show on computer-sized screens. */
.chip.all{grid-column:1/-1;grid-row:1}
.chip[data-k="f1"]{grid-column:1;grid-row:2}
.chip[data-k="wsl"]{grid-column:2;grid-row:2}
.chip[data-k="nat"]{grid-column:1;grid-row:3}
.chip[data-k="mc"]{grid-column:2;grid-row:3}
.chip.ind{display:none}
.chip[aria-pressed="mixed"]{border-color:var(--menu-accent)}
.chip .crests .crest+.crest{margin-left:-7px}
/* Computer (interim layout, 4 columns): All across the top, then F1, Man City, Lionesses, England Men, then the four WSL teams. */
@media (min-width:700px){.chips{grid-template-columns:repeat(4,1fr);grid-template-rows:none;grid-auto-flow:row;gap:10px;margin:0 auto 6px}.chip[data-k]{grid-column:auto;grid-row:auto}.chip.all{grid-column:1/-1}.chip.ind{display:flex}.chip.g{display:none}}
@media (max-width:359px){.chip{font-size:13px;gap:6px;padding-right:8px}.chip .crest{--s:20px!important}}
.logos{margin:16px 0 0;padding:12px 14px;border:1px dashed var(--bd);border-radius:12px;font-size:13px;color:var(--mu)}
.logos b{color:var(--tx)}
.logos ul{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px}
.logos .have{color:#86efac}
/* Installed web app: no site menu, so the title needs no room for the button. */
.app .menu{display:none!important}
.app header{padding:0}
@media (display-mode:standalone){.menu{display:none!important}header{padding:0}}
</style>

<script>

const T={f1:{n:"F1",m:"F1",c:"#E10600"},aw:{n:"Arsenal WSL",m:"AW",c:"#EF0107"},mc:{n:"Man City",m:"MC",c:"#6CABDD"},mu:{n:"Man Utd WSL",m:"MU",c:"#DA291C"},cw:{n:"Chelsea WSL",m:"CW",c:"#1B5FD1"},mw:{n:"Man City WSL",m:"MW",c:"#7DB9E8"},li:{n:"Lionesses",m:"L",c:"#8A3FB0"},en:{n:"England Men",m:"EN",c:"#2B4DB8"}};
// Channel brand colours: [background, text]
const BR={bbc:["#bb1919","#fff"],itv:["#101820","#fff"],sky:["#0072c9","#fff"],tnt:["#d6001c","#fff"],hbo:["#5822b4","#fff"],disney:["#113ccf","#fff"],prime:["#00a8e1","#04202b"],youtube:["#ff0000","#fff"],dazn:["#f8f8f5","#111"]};
const brand=c=>/^BBC/i.test(c)?"bbc":/^ITV/i.test(c)?"itv":/^Sky/i.test(c)?"sky":/^TNT/i.test(c)?"tnt":/^HBO/i.test(c)?"hbo":/^Disney/i.test(c)?"disney":/YouTube/i.test(c)?"youtube":/Prime/i.test(c)?"prime":/^DAZN/i.test(c)?"dazn":c.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Built-in snapshot, used only if fixtures.json can't be loaded.
const EMBED={"updated": "22 Nov 2026, 14:42", "fixtures": [{"t": "mw", "iso": "2026-11-22T12:00:00+00:00", "comp": "Women's Super League", "h": "Man City", "a": "Tottenham Hotspur", "ch": ["Sky Sports Main Event", "Sky Sports Mix"], "note": "", "tbc": false}, {"t": "mu", "iso": "2026-11-22T12:00:00+00:00", "comp": "Women's Super League", "h": "Birmingham City", "a": "Man Utd", "ch": ["Sky Sports+"], "note": "", "tbc": false}, {"t": "aw", "iso": "2026-11-22T14:30:00+00:00", "comp": "Women's Super League", "h": "Arsenal", "a": "West Ham United", "ch": ["BBC Two", "BBC iPlayer"], "note": "", "tbc": false}, {"t": "mc", "iso": "2026-11-24T20:00:00+00:00", "comp": "UEFA Champions League\u00a0League Phase", "h": "Man City", "a": "Napoli", "ch": ["TNT Sports 1", "TNT Sports Ultimate", "HBO Max"], "note": "", "tbc": false}, {"t": "f1", "iso": "2026-11-28T18:00:00+00:00", "comp": "Formula 1, Qualifying", "h": "Qatar Grand Prix", "a": "", "cc": "qa", "sp": false, "ch": ["Sky Sports F1"], "note": "", "tbc": false}, {"t": "f1", "iso": "2026-11-29T16:00:00+00:00", "comp": "Formula 1, Race", "h": "Qatar Grand Prix", "a": "", "cc": "qa", "sp": false, "ch": ["Sky Sports F1"], "note": "", "tbc": false}, {"t": "mc", "iso": "2026-11-29T16:30:00+00:00", "comp": "Premier League", "h": "Arsenal", "a": "Man City", "ch": ["Sky Sports Main Event", "Sky Sports Premier League"], "note": "", "tbc": false}, {"t": "li", "iso": "2026-12-01T17:00:00+00:00", "comp": "FIFA Women's World Cup 2027\u00a0Play-Off 1st Leg", "h": "Ukraine", "a": "England", "ch": ["ITV1", "ITVX"], "note": "", "tbc": false}, {"t": "mc", "iso": "2026-12-02T19:30:00+00:00", "comp": "Premier League", "h": "Man City", "a": "Leeds United", "ch": ["Sky Sports+"], "note": "", "tbc": false}, {"t": "f1", "iso": "2026-12-05T14:00:00+00:00", "comp": "Formula 1, Qualifying", "h": "Abu Dhabi Grand Prix", "a": "", "cc": "ae", "sp": false, "ch": ["Sky Sports F1"], "note": "", "tbc": false}, {"t": "li", "iso": "2026-12-05T17:30:00+00:00", "comp": "FIFA Women's World Cup 2027\u00a0Play-Off 2nd Leg", "h": "England", "a": "Ukraine", "ch": ["ITV1", "ITVX"], "note": "", "tbc": false}, {"t": "mc", "iso": "2026-12-05T20:00:00+00:00", "comp": "Premier League", "h": "Brentford", "a": "Man City", "ch": ["Sky Sports Main Event", "Sky Sports Premier League"], "note": "", "tbc": false}, {"t": "f1", "iso": "2026-12-06T13:00:00+00:00", "comp": "Formula 1, Race", "h": "Abu Dhabi Grand Prix", "a": "", "cc": "ae", "sp": false, "ch": ["Sky Sports F1"], "note": "", "tbc": false}, {"t": "mc", "iso": "2026-12-08T20:00:00+00:00", "comp": "UEFA Champions League\u00a0League Phase", "h": "Barcelona", "a": "Man City", "ch": ["Amazon Prime Video"], "note": "", "tbc": false}, {"t": "aw", "iso": "2026-12-11T19:00:00+00:00", "comp": "Women's Super League", "h": "Everton", "a": "Arsenal", "ch": ["Sky Sports Premier League"], "note": "", "tbc": false}, {"t": "cw", "iso": "2026-12-12T12:45:00+00:00", "comp": "Women's Super League", "h": "Chelsea", "a": "London City Lionesses", "ch": ["BBC One", "BBC iPlayer"], "note": "", "tbc": false}, {"t": "mc", "iso": "2026-12-12T17:30:00+00:00", "comp": "Premier League", "h": "Man City", "a": "Chelsea", "ch": ["Sky Sports Main Event", "Sky Sports Premier League"], "note": "", "tbc": false}, {"t": "mw", "iso": "2026-12-13T12:00:00+00:00", "comp": "Women's Super League", "h": "Crystal Palace", "a": "Man City", "ch": ["Sky Sports"], "note": "Channel to be confirmed", "tbc": false}, {"t": "mu", "iso": "2026-12-13T12:00:00+00:00", "comp": "Women's Super League", "h": "Man Utd", "a": "Brighton & Hove Albion", "ch": ["Sky Sports", "WSL YouTube"], "note": "Channel to be confirmed", "tbc": false}], "updated_iso": "2026-11-22T14:42:00.535162+00:00"};

let F=[],shown=[],heroF=null,sel=new Set(),ready=false,lastSig="";
try{
  const fromHash=location.hash.slice(1).split(",").filter(k=>T[k]);
  const saved=JSON.parse(localStorage.getItem("fx-teams")||"[]").filter(k=>T[k]);
  (fromHash.length?fromHash:saved).forEach(k=>sel.add(k));
}catch(e){}
function persist(){
  const a=[...sel];
  try{localStorage.setItem("fx-teams",JSON.stringify(a));}catch(e){}
  try{history.replaceState(null,"",a.length?"#"+a.join(","):location.pathname+location.search);}catch(e){}
}

// Times show in UK time. Only when the device is in another time zone, a small switch offers "My time" (remembered).
const UK="Europe/London",DEV=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||UK}catch(e){return UK}})();
const DEV_IS_UK=["Europe/London","Europe/Jersey","Europe/Guernsey","Europe/Isle_of_Man","GB","GB-Eire"].includes(DEV);
let tz=UK;
try{if(!DEV_IS_UK&&localStorage.getItem("fx-tz")==="local")tz=DEV;}catch(e){}
const fd=o=>new Intl.DateTimeFormat("en-GB",Object.assign({timeZone:tz},o));
const dayK=d=>fd({year:"numeric",month:"2-digit",day:"2-digit"}).format(d).split("/").reverse().join("-");
const dd=(d,now)=>(new Date(dayK(d))-new Date(dayK(now)))/864e5;
const listEl=document.getElementById("list");

function setUpd(j){
  const el=document.getElementById("upd");
  let t=j.updated||"",warn=false,msg;
  const u=j.updated_iso?new Date(j.updated_iso):null;
  if(u&&!isNaN(u)){t=fd({day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false}).format(u);warn=Date.now()-u>36*36e5;}
  msg=warn?"Fixtures last updated "+t+". Automatic updates may have stalled.":"Fixtures updated "+t;
  // Per-team check: a team whose page hasn't been read successfully for 2+ days is flagged by name.
  const late=Object.keys(T).filter(k=>{const hh=j.health&&j.health[k];if(!hh)return false;const x=hh.last_ok_iso?new Date(hh.last_ok_iso):null;return !x||isNaN(x)||Date.now()-x>48*36e5;});
  if(late.length){warn=true;msg+=(warn&&/stalled/.test(msg)?" ":". ")+"Not refreshed for 2+ days: "+late.map(k=>T[k].n).join(", ")+".";}
  el.className="upd"+(warn?" warn":"");
  el.textContent=msg;
}
// One spelling per club, so logos need one file each and the same match from two teams' pages merges into one card.
const ALIAS={"tottenham":"Tottenham Hotspur","spurs":"Tottenham Hotspur","west ham":"West Ham United","inter":"Inter Milan","hacken":"Hacken"};
const plain=n=>String(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const canon=n=>ALIAS[plain(n).toLowerCase()]||n;
let lastJ=null;
function load(j,stale){
  F=j.fixtures.map(f=>({t:f.t,iso:f.iso,d:new Date(f.iso),comp:f.comp,h:canon(f.h),a:canon(f.a),ch:f.ch||[],note:f.note||"",tbc:!!f.tbc,cc:f.cc||"",sp:!!f.sp})).filter(f=>T[f.t]);
  document.getElementById("stale").textContent=stale?"Showing saved fixtures. Couldn’t load the latest.":"";
  lastJ=j;setUpd(j);ready=true;lastSig="";render();
}
const slow=setTimeout(()=>{if(!ready)listEl.innerHTML='<p class="empty">Loading fixtures…</p>';},700);
fetch("fixtures.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>load(j,false))
  .catch(()=>{try{load(EMBED,true);}catch(e){clearTimeout(slow);listEl.innerHTML='<p class="empty">Couldn’t load fixtures. Check your connection and refresh.</p>';}});
// Refresh when the app or tab comes back to the front (an installed app can stay open for days).
let lastPull=Date.now();
function refresh(){
  if(!ready||Date.now()-lastPull<60000){render();return;}
  lastPull=Date.now();

document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh();});

function crest(k,s,alt){return '<span class="crest" aria-hidden="true" style="--c:'+T[k].c+';--s:'+s+'px"><span>'+T[k].m+'</span><img src="logos/teams/'+k+'.png"'+(alt?' data-alt="'+alt+'"':'')+' alt="" onload="this.parentNode.classList.add(\'has\')" onerror="var a=this.dataset.alt;if(a){this.removeAttribute(\'data-alt\');this.src=a}else this.remove()"></span>';}
function status(f,now){const ms=now-f.d;return ms<0?"up":ms<2*36e5?"live":"ft";}
function relText(f,now){
  const s=status(f,now);
  if(s==="live")return '<span class="live">● Live</span>';
  if(s==="ft")return "Full time";
  const ms=f.d-now,n=dd(f.d,now);
  if(n===0){const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return "In "+(h?h+"h ":"")+m+"m";}
  return n===1?"In 1 day":"In "+n+" days";
}
const label=(f,now)=>{const n=dd(f.d,now);return n===0?"Today":n===1?"Tomorrow":fd({weekday:"short",day:"numeric",month:"short"}).format(f.d);};
const clock=f=>f.tbc?"time TBC":fd({hour:"2-digit",minute:"2-digit",hour12:false}).format(f.d);
function badge(c){
  const k=brand(c),b=BR[k]||["#2a3446","#fff"];
  return '<span class="b" style="--bc:'+b[0]+';--bt:'+b[1]+'"><img src="logos/channels/'+k+'.png" alt="" onerror="this.remove()">'+esc(c)+'</span>';

function chanHtml(f){
  const unconf=/confirm/i.test(f.note);
  return f.ch.length?f.ch.map(badge).join("")+(unconf?'<span class="b tbc">TBC</span>':""):'<span class="b none">'+(unconf?"Channel TBC":esc(f.note||"No UK broadcast"))+'</span>';
}
const slug=n=>String(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const versus=f=>f.a?esc(f.h)+' <span class="v">v</span> '+esc(f.a):esc(f.h);   // F1 sessions have only the grand prix name
const ROOT={f1:"Formula 1",mc:"Man City",mw:"Man City",aw:"Arsenal",mu:"Man Utd",cw:"Chelsea",li:"England",en:"England"};
const initials=n=>{const w=String(n).replace(/[^A-Za-z0-9 ]/g,"").split(/\s+/).filter(Boolean);return(w.length>1?w[0][0]+w[1][0]:(w[0]||"?").slice(0,2)).toUpperCase();};
function oppCrest(n,s){return '<span class="crest" aria-hidden="true" style="--c:#3b5a4c;--s:'+s+'px"><span>'+initials(n)+'</span><img src="logos/opponents/'+slug(n)+'.png" alt="" onload="this.parentNode.classList.add(\'has\')" onerror="this.remove()"></span>';}
// Every match shows both clubs' logos overlapped: home on the left, away on the right.

const COUNTRY={"albania":"al","andorra":"ad","armenia":"am","austria":"at","azerbaijan":"az","belarus":"by","belgium":"be","bosnia and herzegovina":"ba","bosnia-herzegovina":"ba","bulgaria":"bg","croatia":"hr","cyprus":"cy","czechia":"cz","czech republic":"cz","denmark":"dk","estonia":"ee","faroe islands":"fo","finland":"fi","france":"fr","georgia":"ge","germany":"de","gibraltar":"gi","greece":"gr","hungary":"hu","iceland":"is","israel":"il","italy":"it","kazakhstan":"kz","kosovo":"xk","latvia":"lv","liechtenstein":"li","lithuania":"lt","luxembourg":"lu","malta":"mt","moldova":"md","montenegro":"me","netherlands":"nl","holland":"nl","north macedonia":"mk","northern ireland":"gb-nir","norway":"no","poland":"pl","portugal":"pt","republic of ireland":"ie","ireland":"ie","romania":"ro","san marino":"sm","scotland":"gb-sct","serbia":"rs","slovakia":"sk","slovenia":"si","spain":"es","sweden":"se","switzerland":"ch","turkey":"tr","turkiye":"tr","ukraine":"ua","wales":"gb-wls","russia":"ru","argentina":"ar","australia":"au","brazil":"br","canada":"ca","chile":"cl","china":"cn","china pr":"cn","colombia":"co","costa rica":"cr","ecuador":"ec","egypt":"eg","ghana":"gh","haiti":"ht","india":"in","iran":"ir","ivory coast":"ci","jamaica":"jm","japan":"jp","mexico":"mx","morocco":"ma","new zealand":"nz","nigeria":"ng","panama":"pa","paraguay":"py","peru":"pe","qatar":"qa","saudi arabia":"sa","senegal":"sn","south africa":"za","south korea":"kr","korea republic":"kr","uruguay":"uy","usa":"us","united states":"us","venezuela":"ve","zambia":"zm","cameroon":"cm","algeria":"dz","tunisia":"tn","bolivia":"bo","honduras":"hn","trinidad and tobago":"tt","united arab emirates":"ae","uae":"ae","thailand":"th","vietnam":"vn","philippines":"ph","uzbekistan":"uz","jordan":"jo","iraq":"iq","south sudan":"ss","dr congo":"cd","mali":"ml","kenya":"ke","tanzania":"tz","uganda":"ug","zimbabwe":"zw","angola":"ao","guatemala":"gt","el salvador":"sv","cuba":"cu","dominican republic":"do"};
const intl=f=>f.teams.includes("en")||f.teams.includes("li");
const flagOf=n=>COUNTRY[plain(n).toLowerCase()]||"";
function sideBadge(n,f,s){const k=f.teams.find(k=>n.includes(ROOT[k]));if(k==="en"||k==="li")return flagCrest("gb-eng",s);   // England is always the St George flag
  if(k)return crest(k,s,"logos/opponents/"+slug(n)+".png");return intl(f)&&flagOf(n)?flagCrest(flagOf(n),s):oppCrest(n,s);}
// Formula 1: the F1 logo overlapped with the flag of the grand prix's country (logos/flags/<code>.png)
function flagCrest(cc,s){return '<span class="crest" aria-hidden="true" style="--c:#3b5a4c;--s:'+s+'px"><span>'+esc(cc.slice(0,2).toUpperCase())+'</span><img class="flag" src="logos/flags/'+esc(cc)+'.png" alt="" onload="this.parentNode.classList.add(\'has\')" onerror="this.remove()"></span>';}
const matchCrests=(f,s)=>f.teams[0]==="f1"?'<span class="crests">'+crest("f1",s)+(f.cc?flagCrest(f.cc,s):"")+'</span>':'<span class="crests">'+sideBadge(f.h,f,s)+sideBadge(f.a,f,s)+'</span>';
const ORDER=Object.keys(T);
const GROUPS={nat:{n:"National",k:["li","en"]},wsl:{n:"WSL",k:["aw","mu","cw","mw"]}};   // phone-only buttons that select several teams
const keysOf=k=>GROUPS[k]?GROUPS[k].k:[k];
const CHIP_ORDER=["f1","mc","li","en","aw","mu","cw","mw"];   // All, then F1 + the non-WSL teams, then the four WSL teams
const WOMEN=["aw","mu","cw","mw","li"],MEN=["mc","en"];   // Formula 1 gets neither
const gender=f=>f.teams.every(k=>WOMEN.includes(k))?"w":f.teams.every(k=>MEN.includes(k))?"m":"";
const names=f=>f.teams.map(k=>T[k].n.toUpperCase()).join(" · ");
const cvars=f=>"--c:"+T[f.teams[0]].c+";--c2:"+T[f.teams[f.teams.length-1]].c;
// One match followed through two teams (e.g. Arsenal v Chelsea) becomes a single card with both badges.
// Formula 1: every session on the same day for the same Grand Prix becomes one card with a list of sessions.
// The card follows the next session that hasn't finished; earlier ones that are over are dimmed.
// Add to calendar: one .ics file per card (a Formula 1 day card holds every session still to come).
const icsDate=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
const icsText=s=>String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1");
const icsFold=l=>{const o=[];while(l.length>73){o.push(l.slice(0,73));l=" "+l.slice(73);}o.push(l);return o.join("\r\n");};
function calEvents(f){
  const chan=f.ch.length?"Watch on "+f.ch.join(", "):"";
  if(f.ses)return f.ses.filter(s=>!s.done).map(s=>({title:f.h+": "+s.name,d:s.d,tbc:s.tbc,mins:/Race/.test(s.name)?120:60,desc:"Formula 1. "+chan}));
  if(f.t==="f1"){const nm=String(f.comp).replace(/ · Sprint weekend$/,"").split(", ").slice(1).join(", ");
    return [{title:f.h+": "+nm,d:f.d,tbc:f.tbc,mins:/Race/.test(nm)?120:60,desc:"Formula 1. "+chan}];}
  return [{title:f.h+" v "+f.a,d:f.d,tbc:f.tbc,mins:120,desc:f.comp+(chan?". "+chan:"")}];
}
function icsFile(f){
  const stamp=icsDate(new Date()),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//hibbs.org.uk//Fixtures//EN","CALSCALE:GREGORIAN"];
  calEvents(f).forEach(e=>{
    L.push("BEGIN:VEVENT","UID:"+icsDate(e.d)+"-"+slug(e.title)+"@hibbs.org.uk","DTSTAMP:"+stamp);
    if(e.tbc)L.push("DTSTART;VALUE=DATE:"+dayK(e.d).replace(/-/g,""),"SUMMARY:"+icsText(e.title+" (time TBC)"));
    else L.push("DTSTART:"+icsDate(e.d),"DTEND:"+icsDate(new Date(e.d.getTime()+e.mins*6e4)),"SUMMARY:"+icsText(e.title));
    L.push("DESCRIPTION:"+icsText(e.desc),"END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n")+"\r\n";
}
function addToCal(f){
  const evs=calEvents(f);if(!evs.length)return;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([icsFile(f)],{type:"text/calendar;charset=utf-8"}));
  a.download=slug(evs[0].title)+".ics";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const calBtn=(f,ref,now)=>status(f,now)==="ft"?"":'<button class="cal" type="button" data-cal="'+ref+'" aria-label="Add to calendar: '+esc(f.a?f.h+" v "+f.a:f.h)+'" title="Add to calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M12 12.5v6M9 15.5h6"/></svg></button>';
document.addEventListener("click",e=>{const b=e.target.closest("[data-cal]");if(!b)return;const f=b.dataset.cal==="h"?heroF:shown[+b.dataset.cal];if(f)addToCal(f);});
const sesHtml=f=>f.ses?'<ul class="ses">'+f.ses.map(s=>'<li'+(s.done?' class="done"':'')+'><span>'+esc(s.name)+'</span><time datetime="'+esc(s.iso)+'">'+(s.tbc?"Time TBC":clock(s))+'</time></li>').join("")+'</ul>':"";
function f1Groups(list,now){
  const m=new Map();
  list.filter(f=>f.t==="f1").forEach(f=>{
    const k=f.h+"|"+dayK(f.d);
    if(!m.has(k))m.set(k,{base:f,ses:[]});
    m.get(k).ses.push({name:String(f.comp).split(", ").slice(1).join(", ")||f.comp,d:f.d,iso:f.iso,tbc:f.tbc});
  });
  return [...m.values()].map(({base,ses})=>{
    ses.sort((a,b)=>a.d-b.d);
    const cur=ses.find(s=>status(s,now)!=="ft")||ses[ses.length-1];
    ses.forEach(s=>{s.done=s.d<cur.d;});
    const many=ses.length>1;
    return Object.assign({},base,{teams:["f1"],ses:many?ses:null,d:cur.d,iso:cur.iso,tbc:cur.tbc,comp:(many?"Formula 1":base.comp)+(base.sp?" · Sprint weekend":"")});
  });
}
function mergeDupes(list,now){
  const m=new Map();
  list.filter(f=>f.t!=="f1").forEach(f=>{
    const k=f.iso+"|"+[f.h,f.a].map(s=>s.toLowerCase()).sort().join("|"),g=m.get(k);
    if(!g){m.set(k,Object.assign({},f,{teams:[f.t],ch:f.ch.slice()}));return;}
    if(!g.teams.includes(f.t))g.teams.push(f.t);
    f.ch.forEach(c=>{if(!g.ch.includes(c))g.ch.push(c);});
    g.note=(g.note&&f.note)?g.note:"";
    g.tbc=g.tbc&&f.tbc;
    if(!g.comp)g.comp=f.comp;
  });
  const out=[...m.values()];
  out.forEach(g=>g.teams.sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)));
  return out.concat(f1Groups(list,now)).sort((a,b)=>a.d-b.d);
}
function hero(f,now){
  return '<section class="hero'+(gender(f)?' g'+gender(f):'')+'" style="'+cvars(f)+'" aria-label="Next match"><div class="hk">'+(status(f,now)==="live"?"LIVE NOW":"NEXT UP")+' · '+names(f)+'</div>'+
    '<div class="hrow"><div class="hcount">'+label(f,now)+'</div>'+matchCrests(f,52)+'</div>'+
    '<div class="hsub"><time datetime="'+esc(f.iso)+'">'+(f.tbc?"Time TBC":clock(f))+'</time> · '+esc(f.comp)+'</div>'+
    '<div class="hvs">'+versus(f)+'</div>'+sesHtml(f)+'<div class="ch">'+chanHtml(f)+calBtn(f,"h",now)+'</div></section>';
}
function emptyMsg(){
  if(!sel.size)return "No upcoming fixtures listed.";
  const ks=[...sel],n=ks.map(k=>T[k].n),nm=n.length>1?n.slice(0,-1).join(", ")+" and "+n[n.length-1]:n[0];
  const note=ks.includes("f1")?"Formula 1 sessions are listed up to 60 days ahead, so a new season appears once its calendar is published."
    :ks.some(k=>k==="li"||k==="en")?"International fixtures appear once the next window is announced."
    :"New fixtures appear as the TV listings are published.";
  return "No upcoming fixtures for "+nm+" right now.<span>"+note+"</span>";
}
function render(){
  if(!ready)return;
  const now=new Date();
  const all=mergeDupes(F.filter(f=>f.d>now-3*36e5&&(sel.size===0||sel.has(f.t))).sort((a,b)=>a.d-b.d),now);
  heroF=all.find(f=>status(f,now)!=="ft")||null;
  shown=all.filter(f=>f!==heroF);
  // Rebuild the list only when something visible changes; otherwise just refresh the countdowns.
  const sig="u|"+(heroF?heroF.teams.join()+heroF.iso+(heroF.ses?heroF.ses.length:"")+label(heroF,now)+status(heroF,now):"")+"|"+shown.map(f=>f.teams.join()+f.iso+(f.ses?f.ses.length:"")+label(f,now)+status(f,now)).join(";")+"|"+sel.size;
  if(sig===lastSig){
    listEl.querySelectorAll(".rel").forEach(el=>{el.innerHTML=relText(shown[+el.dataset.i],now);});
    return;
  }
  lastSig=sig;
  if(!all.length){listEl.innerHTML='<p class="empty">'+emptyMsg()+'</p>';return;}
  let last="";
  listEl.innerHTML=(heroF?hero(heroF,now):"")+shown.map((f,i)=>{
    const mk=fd({month:"long",year:"numeric"}).format(f.d);
    const head=mk!==last?'<h2 class="month">'+mk+'</h2>':"";last=mk;
    const note=f.ch.length&&f.note&&!/confirm/i.test(f.note)?'<div class="meta">'+esc(f.note)+'</div>':"";
    return head+'<article class="card'+(gender(f)?' g'+gender(f):'')+'" style="'+cvars(f)+'"><div class="top">'+matchCrests(f,40)+'<div class="who"><div class="tag">'+names(f)+'</div><div class="comp">'+esc(f.comp)+'</div></div><time class="when" datetime="'+esc(f.iso)+'"><b>'+label(f,now)+'</b><span>'+(f.tbc?"Time TBC":clock(f))+'</span></time></div>'+
      '<div class="vs">'+versus(f)+'</div>'+sesHtml(f)+'<div class="meta rel" data-i="'+i+'">'+relText(f,now)+'</div>'+note+'<div class="ch">'+chanHtml(f)+calBtn(f,i,now)+'</div></article>';
  }).join("");
}
function pressed(){document.querySelectorAll("#chips [data-k]").forEach(b=>{const k=b.dataset.k;
  if(k==="all"){b.setAttribute("aria-pressed",sel.size===0);return;}
  const ks=keysOf(k),n=ks.filter(x=>sel.has(x)).length;

(function(){
  const c=document.getElementById("chips");
  const solo=(k,cls)=>'<button class="chip'+(cls?" "+cls:"")+'" type="button" data-k="'+k+'">'+crest(k,24)+'<span class="lbl">'+T[k].n+'</span></button>';
  const group=k=>'<button class="chip g" type="button" data-k="'+k+'"><span class="crests">'+GROUPS[k].k.map(x=>crest(x,22)).join("")+'</span><span class="lbl">'+GROUPS[k].n+'</span></button>';
  c.innerHTML='<button class="chip all" type="button" data-k="all">All</button>'+CHIP_ORDER.map(k=>solo(k,(k==="f1"||k==="mc")?"":"ind")).join("")+group("nat")+group("wsl");

(function(){

// Add ?logos to the address (sports.html?logos) to see which logo files you can add.

if(/[?&]logos\b/.test(location.search))addEventListener("load",()=>setTimeout(()=>{
  if(!ready)return;
