<style>

: "Spain", "a": "England", "ch": ["ITV1", "ITVX"], "note": "", "tbc": false}, {"t": "aw", "iso": "2026-11-19T20:00:00+00:00", "comp": "Women’s Champions League", "h": "Arsenal", "a": "Lyon", "ch": ["Disney+"], "note": "", "tbc": false}, {"t": "mc", "iso": "2026-11-21T12:30:00+00:00", "comp": "Premier League", "h": "Man City", "a": "Fulham", "ch": ["TNT Sports 1", "TNT Sports Ultimate", "HBO Max"], "note": "", "tbc": false}, {"t": "cw", "iso": "2026-11-21T12:45:00+00:00", "comp": "Women’s Super League", "h": "Liverpool", "a": "Chelsea", "ch": ["Sky Sports Premier League", "Sky Sports Mix"], "note": "", "tbc": false}, {"t": "aw", "iso": "2026-11-22T12:30:00+00:00", "comp": "Women’s Super League", "h": "Arsenal", "a": "West Ham", "ch": ["BBC Two", "BBC iPlayer"], "note": "", "tbc": false}, {"t": "mc", "iso": "2026-11-24T20:00:00+00:00", "comp": "Champions League", "h": "Man City", "a": "Napoli", "ch": ["TNT Sports", "HBO Max"], "note": "TNT channel to be confirmed", "tbc": false}, {"t": "li", "iso": "2026-11-26T12:00:00+00:00", "comp": "World Cup play-off, 1st leg", "h": "Ukraine", "a": "England", "ch": ["ITV"], "note": "Kick-off time and channel to be confirmed", "tbc": true}, {"t": "mc", "iso": "2026-11-29T16:30:00+00:00", "comp": "Premier League", "h": "Arsenal", "a": "Man City", "ch": ["Sky Sports Main Event", "Sky Sports Premier League"], "note": "", "tbc": false}, {"t": "mc", "iso": "2026-12-02T19:30:00+00:00", "comp": "Premier League", "h": "Man City", "a": "Leeds United", "ch": ["Sky Sports"], "note": "Sky channel to be confirmed", "tbc": false}, {"t": "li", "iso": "2026-12-05T12:00:00+00:00", "comp": "World Cup play-off, 2nd leg", "h": "England", "a": "Ukraine", "ch": ["ITV"], "note": "Kick-off time and channel to be confirmed", "tbc": true}, {"t": "mc", "iso": "2026-12-05T20:00:00+00:00", "comp": "Premier League", "h": "Brentford", "a": "Man City", "ch": ["Sky Sports Main Event", "Sky Sports Premier League"], "note": "", "tbc": false}, {"t": "mc", "iso": "202 let F=[],R=[],shown=[],heroF=null,sel=new Set(),ready=false,lastSig="",view="up";
try{
  const fromHash=location.hash.slice(1).split(",").filter(k=>T[k]);
  const saved=JSON.parse(localStorage.getItem("fx-teams")||"[]").filter(k=>T[k]);
  (fromHash.length?fromHash:saved).forEach(k=>sel.add(k));
}catch(e){}
function persist(){
  const a=[...sel];
  try{localStorage.setItem("fx-teams",JSON.stringify(a));}catch(e){}
  try{history.replaceState(null,"",a.length?"#"+a.join(","):location.pathname+location.search);}catch(e){}
}

const tz="Europe/London";
const fd=o=>new Intl.DateTimeFormat("en-GB",Object.assign({timeZone:tz},o));
const dayK=d=>fd({year:"numeric",month:"2-digit",day:"2-digit"}).format(d).split("/").reverse().join("-");
const dd=(d,now)=>(new Date(dayK(d))-new Date(dayK(now)))/864e5;
const listEl=document.getElementById("list");

function setUpd(j){
  const el=document.getElementById("upd");
  let t=j.updated||"",warn=false;
  const u=j.updated_iso?new Date(j.updated_iso):null;
  if(u&&!isNaN(u)){t=fd({day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false}).format(u);warn=Date.now()-u>36*36e5;}
  el.className="upd"+(warn?" warn":"");
  el.textContent=warn?"Fixtures last updated "+t+". Automatic updates may have stalled.":"Fixtures updated "+t;
}
function load(j,stale){
  F=j.fixtures.map(f=>({t:f.t,iso:f.iso,d:new Date(f.iso),comp:f.comp,h:f.h,a:f.a,ch:f.ch||[],note:f.note||"",tbc:!!f.tbc})).filter(f=>T[f.t]);
  document.getElementById("stale").textContent=stale?"Showing saved fixtures. Couldn’t load the latest.":"";
  setUpd(j);ready=true;lastSig="";render();
}
const slow=setTimeout(()=>{if(!ready)listEl.innerHTML='<p class="empty">Loading fixtures…</p>';},700);
fetch("fixtures.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>load(j,false))
  .catch(()=>{try{load(EMBED,true);}catch(e){clearTimeout(slow);listEl.innerHTML='<p class="empty">Couldn’t load fixtures. Check your connection and refresh.</p>';}});
// Results are optional: the Results tab only appears once results.json exists and has entries.
fetch("results.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{
  if(!j||!Array.isArray(j.results))return;
  R=j.results.map(r=>({t:r.t,iso:r.iso,d:new Date(r.iso),comp:r.comp||"",h:r.h,a:r.a,hs:+r.hs,as:+r.as})).filter(r=>T[r.t]&&!isNaN(r.d)&&!isNaN(r.hs)&&!isNaN(r.as));
  document.getElementById("tabs").hidden=!R.length;
}).catch(()=>{});

function crest(k,s){return '<span class="crest" style="--c:'+T[k].c+';--s:'+s+'px"><span>'+T[k].m+'</span><img src="logos/teams/'+k+'.png" alt="" onload="this.parentNode.classList.add(\'has\')" onerror="this.remove()"></span>';}
function status(f,now){const ms=now-f.d;return ms<0?"up":ms<2*36e5?"live":"ft";}
function relText(f,now){
  const s=status(f,now);
  if(s==="live")return '<span class="live">● Live</span>';
  if(s==="ft")return "Full time";
  const ms=f.d-now,n=dd(f.d,now);
  if(n===0){const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return "In "+(h?h+"h ":"")+m+"m";}
  return n===1?"In 1 day":"In "+n+" days";
}
function bigCount(f,now){
  if(status(f,now)!=="up")return "Live";
  const ms=f.d-now,d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  return d?d+"d "+h+"h":h?h+"h "+m+"m":Math.max(m,1)+"m";
}
const label=(f,now)=>{const n=dd(f.d,now);return n===0?"Today":n===1?"Tomorrow":fd({weekday:"short",day:"numeric",month:"short"}).format(f.d);};
const clock=f=>f.tbc?"time TBC":fd({hour:"2-digit",minute:"2-digit",hour12:false}).format(f.d);
function badge(c){
  const k=brand(c),b=BR[k]||["#2a3446","#fff"];
  return '<span class="b" style="--bc:'+b[0]+';--bt:'+b[1]+'"><img src="logos/channels/'+k+'.png" alt="" onerror="this.remove()">'+esc(c)+'</span>';
}
function chanHtml(f){
  const unconf=/confirm/i.test(f.note);
  return f.ch.length?f.ch.map(badge).join("")+(unconf?'<span class="b tbc">TBC</span>':""):'<span class="b none">'+(unconf?"Channel TBC":esc(f.note||"No UK broadcast"))+'</span>';
}
function hero(f,now){
  return '<section class="hero" style="--c:'+T[f.t].c+'" aria-label="Next match"><div class="hk">'+(status(f,now)==="live"?"LIVE NOW":"NEXT UP")+' · '+T[f.t].n.toUpperCase()+'</div>'+
    '<div class="hrow"><div class="hcount">'+bigCount(f,now)+'</div>'+crest(f.t,52)+'</div>'+
    '<div class="hsub"><time datetime="'+esc(f.iso)+'">'+label(f,now)+(f.tbc?" · time TBC":", "+clock(f))+'</time> · '+esc(f.comp)+'</div>'+
    '<div class="hvs">'+esc(f.h)+' v '+esc(f.a)+'</div><div class="ch">'+chanHtml(f)+'</div></section>';
}
function render(){
  if(!ready)return;
  if(view==="res")return renderResults();
  const now=new Date();
  const all=F.filter(f=>f.d>now-3*36e5&&(sel.size===0||sel.has(f.t))).sort((a,b)=>a.d-b.d);
  heroF=all.find(f=>status(f,now)!=="ft")||null;
  shown=all.filter(f=>f!==heroF);
  // Rebuild the list only when something visible changes; otherwise just refresh the countdowns.
  const sig="u|"+(heroF?heroF.t+heroF.iso+label(heroF,now)+status(heroF,now):"")+"|"+shown.map(f=>f.t+f.iso+label(f,now)+status(f,now)).join(";")+"|"+sel.size;
  if(sig===lastSig){
    const h=listEl.querySelector(".hcount");if(h&&heroF)h.textContent=bigCount(heroF,now);
    listEl.querySelectorAll(".rel").forEach(el=>{el.innerHTML=relText(shown[+el.dataset.i],now);});
    return;
  }
  lastSig=sig;
  if(!all.length){listEl.innerHTML='<p class="empty">'+(sel.size?"No upcoming fixtures for the selected teams.":"No upcoming fixtures listed.")+'</p>';return;}
  let last="";
  listEl.innerHTML=(heroF?hero(heroF,now):"")+shown.map((f,i)=>{
    const mk=fd({month:"long",year:"numeric"}).format(f.d);
    const head=mk!==last?'<h2 class="month">'+mk+'</h2>':"";last=mk;
    const note=f.ch.length&&f.note&&!/confirm/i.test(f.note)?'<div class="meta">'+esc(f.note)+'</div>':"";
    return head+'<article class="card" style="--c:'+T[f.t].c+'"><div class="top">'+crest(f.t,40)+'<div class="who"><div class="tag">'+T[f.t].n.toUpperCase()+'</div><div class="comp">'+esc(f.comp)+'</div></div><time class="when" datetime="'+esc(f.iso)+'"><b>'+label(f,now)+'</b><span>'+(f.tbc?"Time TBC":clock(f))+'</span></time></div>'+
      '<div class="vs">'+esc(f.h)+' v '+esc(f.a)+'</div><div class="meta rel" data-i="'+i+'">'+relText(f,now)+'</div>'+note+'<div class="ch">'+chanHtml(f)+'</div></article>';
  }).join("");
}
const ROOT={mc:"Man City",aw:"Arsenal",mu:"Man Utd",cw:"Chelsea",li:"England",en:"England"};
function renderResults(){
  const items=R.filter(r=>sel.size===0||sel.has(r.t)).sort((a,b)=>b.d-a.d).slice(0,24);
  const sig="r|"+items.map(r=>r.t+r.iso).join(";");
  if(sig===lastSig)return;
  lastSig=sig;
  if(!items.length){listEl.innerHTML='<p class="empty">No recent results for the selected teams.</p>';return;}
  let last="";
  listEl.innerHTML=items.map(r=>{
    const mk=fd({month:"long",year:"numeric"}).format(r.d);
    const head=mk!==last?'<h2 class="month">'+mk+'</h2>':"";last=mk;
    const home=r.h.includes(ROOT[r.t]),mine=home?r.hs:r.as,theirs=home?r.as:r.hs;
    const o=mine>theirs?"w":mine<theirs?"l":"d";
    return head+'<article class="card" style="--c:'+T[r.t].c+'"><div class="top">'+crest(r.t,40)+'<div class="who"><div class="tag">'+T[r.t].n.toUpperCase()+'</div><div class="comp">'+esc(r.comp)+' · <time datetime="'+esc(r.iso)+'">'+fd({weekday:"short",day:"numeric",month:"short"}).format(r.d)+'</time></div></div>'+
      '<div class="score"><b>'+r.hs+'–'+r.as+'</b><span class="wdl '+o+'">'+o.toUpperCase()+'</span></div></div><div class="vs">'+esc(r.h)+' v '+esc(r.a)+'</div></article>';
  }).join("");
}
function pressed(){document.querySelectorAll("#chips [data-k]").forEach(b=>{const k=b.dataset.k;b.setAttribute("aria-pressed",k==="all"?sel.size===0:sel.has(k));});}
(function(){
  const c=document.getElementById("chips");
  c.innerHTML='<button class="chip all" type="button" data-k="all">All</button>'+Object.keys(T).map(k=>'<button class="chip" type="button" data-k="'+k+'">'+crest(k,24)+T[k].n+'</button>').join("");
  c.onclick=e=>{
    const b=e.target.closest("[data-k]");if(!b)return;
    const k=b.dataset.k;
    if(k==="all")sel.clear();else if(sel.has(k))sel.delete(k);else sel.add(k);
    persist();pressed();render();
  };
  pressed();
  document.getElementById("tabs").onclick=e=>{
    const b=e.target.closest("[data-v]");if(!b)return;
    view=b.dataset.v;
    document.querySelectorAll("#tabs [data-v]").forEach(x=>x.setAttribute("aria-pressed",x===b));
    lastSig="";render();
  };
})();
setInterval(render,60000);
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("sports-sw.js",{scope:"./sports.html"}).catch(()=>{}));
</script>
</body>
</html>
