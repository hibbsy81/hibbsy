}
function load(j,stale){
  F=j.fixtures.map(f=>({t:f.t,iso:f.iso,d:new Date(f.iso),comp:f.comp,h:f.h,a:f.a,ch:f.ch||[],note:f.note||"",tbc:!!f.tbc})).filter(f=>T[f.t]);
  document.getElementById("stale").textContent=stale?"Showing saved fixtures. Couldn’t load the latest.":"";
  setUpd(j);ready=true;lastSig="";render();
}
const slow=setTimeout(()=>{if(!ready)listEl.innerHTML='<p class="empty">Loading fixtures…</p>';},700);
fetch("fixtures.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>load(j,false))
  .catch(()=>{try{load(EMBED,true);}catch(e){clearTimeout(slow);listEl.innerHTML='<p class="empty">Couldn’t load fixtures. Check your connection and refresh.</p>';}});
function crest(k,s,alt){return '<span class="crest" aria-hidden="true" style="--c:'+T[k].c+';--s:'+s+'px"><span>'+T[k].m+'</span><img src="logos/teams/'+k+'.png"'+(alt?' data-alt="'+alt+'"':'')+' alt="" onload="this.parentNode.classList.add(\'has\')" onerror="var a=this.dataset.alt;if(a){this.removeAttribute(\'data-alt\');this.src=a}else this.remove()"></span>';}
function status(f,now){const ms=now-f.d;return ms<0?"up":ms<2*36e5?"live":"ft";}
function relText(f,now){
  const s=status(f,now);
  if(s==="live")return '<span class="live">● Live</span>';
  if(s==="ft")return "Full time";
  const ms=f.d-now,n=dd(f.d,now);
  if(n===0){const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return "In "+(h?h+"h ":"")+m+"m";}
  return n===1?"In 1 day":"In "+n+" days";
}
const label=(f,now)=>{const n=dd(f.d,now);return n===0?"Today":n===1?"Tomorrow":fd({weekday:"short",day:"numeric",month:"short"}).format(f.d);};
const clock=f=>f.tbc?"time TBC":fd({hour:"2-digit",minute:"2-digit",hour12:false}).format(f.d);
function badge(c){
  const k=brand(c),b=BR[k]||["#2a3446","#fff"];
  return '<span class="b" style="--bc:'+b[0]+';--bt:'+b[1]+'"><img src="logos/channels/'+k+'.png" alt="" onerror="this.remove()">'+esc(c)+'</span>';
}
function chanHtml(f){
  const unconf=/confirm/i.test(f.note);
  return f.ch.length?f.ch.map(badge).join("")+(unconf?'<span class="b tbc">TBC</span>':""):'<span class="b none">'+(unconf?"Channel TBC":esc(f.note||"No UK broadcast"))+'</span>';
}
const slug=n=>String(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const versus=f=>esc(f.h)+' <span class="v">v</span> '+esc(f.a);
const ROOT={mc:"Man City",mw:"Man City",aw:"Arsenal",mu:"Man Utd",cw:"Chelsea",li:"England",en:"England"};
const initials=n=>{const w=String(n).replace(/[^A-Za-z0-9 ]/g,"").split(/\s+/).filter(Boolean);return(w.length>1?w[0][0]+w[1][0]:(w[0]||"?").slice(0,2)).toUpperCase();};
function oppCrest(n,s){return '<span class="crest" aria-hidden="true" style="--c:#3b5a4c;--s:'+s+'px"><span>'+initials(n)+'</span><img src="logos/opponents/'+slug(n)+'.png" alt="" onload="this.parentNode.classList.add(\'has\')" onerror="this.remove()"></span>';}
// Every match shows both clubs' logos overlapped: home on the left, away on the right.
function sideBadge(n,f,s){const k=f.teams.find(k=>n.includes(ROOT[k]));return k?crest(k,s,"logos/opponents/"+slug(n)+".png"):oppCrest(n,s);}
const matchCrests=(f,s)=>'<span class="crests">'+sideBadge(f.h,f,s)+sideBadge(f.a,f,s)+'</span>';
const ORDER=Object.keys(T);
const names=f=>f.teams.map(k=>T[k].n.toUpperCase()).join(" · ");
const cvars=f=>"--c:"+T[f.teams[0]].c+";--c2:"+T[f.teams[f.teams.length-1]].c;
// One match followed through two teams (e.g. Arsenal v Chelsea) becomes a single card with both badges.
function mergeDupes(list){
  const m=new Map();
  list.forEach(f=>{
    const k=f.iso+"|"+[f.h,f.a].map(s=>s.toLowerCase()).sort().join("|"),g=m.get(k);
    if(!g){m.set(k,Object.assign({},f,{teams:[f.t],ch:f.ch.slice()}));return;}
    if(!g.teams.includes(f.t))g.teams.push(f.t);
    f.ch.forEach(c=>{if(!g.ch.includes(c))g.ch.push(c);});
    g.note=(g.note&&f.note)?g.note:"";
    g.tbc=g.tbc&&f.tbc;
    if(!g.comp)g.comp=f.comp;
  });
  const out=[...m.values()];
  out.forEach(g=>g.teams.sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)));
  return out;
}
function hero(f,now){
  return '<section class="hero" style="'+cvars(f)+'" aria-label="Next match"><div class="hk">'+(status(f,now)==="live"?"LIVE NOW":"NEXT UP")+' · '+names(f)+'</div>'+
    '<div class="hrow"><div class="hcount">'+label(f,now)+'</div>'+matchCrests(f,52)+'</div>'+
    '<div class="hsub"><time datetime="'+esc(f.iso)+'">'+(f.tbc?"Time TBC":clock(f))+'</time> · '+esc(f.comp)+'</div>'+
    '<div class="hvs">'+versus(f)+'</div><div class="ch">'+chanHtml(f)+'</div></section>';
}
function render(){
  if(!ready)return;
  const now=new Date();
  const all=mergeDupes(F.filter(f=>f.d>now-3*36e5&&(sel.size===0||sel.has(f.t))).sort((a,b)=>a.d-b.d));
  heroF=all.find(f=>status(f,now)!=="ft")||null;
  shown=all.filter(f=>f!==heroF);
  // Rebuild the list only when something visible changes; otherwise just refresh the countdowns.
  const sig="u|"+(heroF?heroF.teams.join()+heroF.iso+label(heroF,now)+status(heroF,now):"")+"|"+shown.map(f=>f.teams.join()+f.iso+label(f,now)+status(f,now)).join(";")+"|"+sel.size;
  if(sig===lastSig){
    listEl.querySelectorAll(".rel").forEach(el=>{el.innerHTML=relText(shown[+el.dataset.i],now);});
    return;
  }
  lastSig=sig;
  if(!all.length){listEl.innerHTML='<p class="empty">'+(sel.size?"No upcoming fixtures for the selected teams.":"No upcoming fixtures listed.")+'</p>';return;}
  let last="";
  listEl.innerHTML=(heroF?hero(heroF,now):"")+shown.map((f,i)=>{
    const mk=fd({month:"long",year:"numeric"}).format(f.d);
    const head=mk!==last?'<h2 class="month">'+mk+'</h2>':"";last=mk;
    const note=f.ch.length&&f.note&&!/confirm/i.test(f.note)?'<div class="meta">'+esc(f.note)+'</div>':"";
    return head+'<article class="card" style="'+cvars(f)+'"><div class="top">'+matchCrests(f,40)+'<div class="who"><div class="tag">'+names(f)+'</div><div class="comp">'+esc(f.comp)+'</div></div><time class="when" datetime="'+esc(f.iso)+'"><b>'+label(f,now)+'</b><span>'+(f.tbc?"Time TBC":clock(f))+'</span></time></div>'+
      '<div class="vs">'+versus(f)+'</div><div class="meta rel" data-i="'+i+'">'+relText(f,now)+'</div>'+note+'<div class="ch">'+chanHtml(f)+'</div></article>';
  }).join("");
}
function pressed(){document.querySelectorAll("#chips [data-k]").forEach(b=>{const k=b.dataset.k;b.setAttribute("aria-pressed",k==="all"?sel.size===0:sel.has(k));});}
(function(){
  const c=document.getElementById("chips");
  c.innerHTML='<button class="chip all" type="button" data-k="all">All</button>'+Object.keys(T).map(k=>'<button class="chip" type="button" data-k="'+k+'">'+crest(k,24)+'<span class="lbl">'+T[k].n+'</span></button>').join("");
  c.onclick=e=>{
    const b=e.target.closest("[data-k]");if(!b)return;
    const k=b.dataset.k;
    if(k==="all")sel.clear();else if(sel.has(k))sel.delete(k);else sel.add(k);
    persist();pressed();render();
  };
  pressed();
})();
setInterval(render,60000);
// Add ?logos to the address (sports.html?logos) to see which opponent logo files you can add.
if(/[?&]logos\b/.test(location.search))addEventListener("load",()=>setTimeout(()=>{
  if(!ready)return;
  const names=[...new Set(F.flatMap(f=>[f.h,f.a]))].sort(),box=document.createElement("div");
  box.className="logos";box.innerHTML="<b>Opponent logos</b> — save PNGs in <code>logos/opponents/</code> with these names:<ul></ul>";
  const ul=box.querySelector("ul");
  names.forEach(n=>{const li=document.createElement("li"),img=new Image(),f=slug(n)+".png";li.textContent="✗ "+f;
    img.onload=()=>{li.textContent="✓ "+f;li.className="have";};img.src="logos/opponents/"+f;ul.appendChild(li);});
  document.getElementById("chips").after(box);},600));
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("sports-sw.js",{scope:"./sports.html"}).catch(()=>{}));
</script>
</body>
