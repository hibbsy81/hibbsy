<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lipid Calculator</title>
<link rel="manifest" href="/lipids.webmanifest">
<link rel="icon" type="image/svg+xml" href="/lipids-favicon.svg">
<link rel="apple-touch-icon" href="/lipids-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lipids">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9f0f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#061011" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: a grid of soft glass cards on a tinted ground. Title and Clear on one row, two input cards side by side, one large gradient result panel, then a rounded scale bar. Everything stays inside one phone screen. */
:root {
  --bg: #e9f0f1;
  --glow-a: rgba(14, 90, 98, 0.20);
  --glow-b: rgba(242, 84, 91, 0.14);
  --surface: rgba(255, 255, 255, 0.86);
  --field: rgba(14, 90, 98, 0.07);
  --fg: #0c1a1b;
  --muted: #587070;
  --line: rgba(12, 26, 27, 0.09);
  --accent: #0e5a62;
  --accent-soft: rgba(14, 90, 98, 0.22);
  --ready-from: #14808c;
  --ready-to: #0a4a52;
  --ready-glow: rgba(10, 74, 82, 0.55);
  --on-solid: #ffffff;
  --shadow: 0 1px 2px rgba(12, 26, 27, 0.06), 0 14px 30px -14px rgba(12, 26, 27, 0.25);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #061011;
    --glow-a: rgba(60, 170, 180, 0.20);
    --glow-b: rgba(242, 84, 91, 0.12);
    --surface: rgba(22, 36, 37, 0.80);
    --field: rgba(255, 255, 255, 0.07);
    --fg: #eaf4f4;
    --muted: #94adad;
    --line: rgba(255, 255, 255, 0.10);
    --accent: #6cc5cd;
    --accent-soft: rgba(108, 197, 205, 0.30);
    --ready-from: #1b8f9c;
    --ready-to: #0b4d56;
    --ready-glow: rgba(60, 170, 180, 0.40);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 34px -14px rgba(0, 0, 0, 0.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #061011;
  --glow-a: rgba(60, 170, 180, 0.20);
  --glow-b: rgba(242, 84, 91, 0.12);
  --surface: rgba(22, 36, 37, 0.80);
  --field: rgba(255, 255, 255, 0.07);
  --fg: #eaf4f4;
  --muted: #94adad;
  --line: rgba(255, 255, 255, 0.10);
  --accent: #6cc5cd;
  --accent-soft: rgba(108, 197, 205, 0.30);
  --ready-from: #1b8f9c;
  --ready-to: #0b4d56;
  --ready-glow: rgba(60, 170, 180, 0.40);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 34px -14px rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(90% 38% at 0% 0%, var(--glow-a), transparent 70%),
    radial-gradient(80% 34% at 100% 6%, var(--glow-b), transparent 70%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
  padding-block: 16px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.wrap {
  width: 100%;
  max-width: 440px;
  margin-inline: auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas:
    "title  clear"
    "inputs inputs"
    "result result";
  gap: 14px 12px;
  align-items: center;
}
h1 {
  grid-area: title;
  margin: 0;
  font-size: 1.625rem;
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.025em;
  text-wrap: balance;
}

/* Inputs */
.inputs {
  grid-area: inputs;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
}
.field {
  min-width: 0;
  display: grid;
  gap: 2px;
  padding: 12px 16px 10px;
  background: var(--surface);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.field:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow);
}
label {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--muted);
}
input {
  width: 100%;
  min-width: 0;
  font: inherit;
  font-size: 2rem;
  font-weight: 650;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
  background: transparent;
  border: 0;
  border-radius: 0;
  padding: 0;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
input::placeholder { color: var(--muted); opacity: 0.45; }

/* Result */
.result {
  grid-area: result;
  --from: var(--surface);
  --to: var(--surface);
  --shine: transparent;
  display: grid;
  gap: 10px;
  padding: 18px 20px 20px;
  color: var(--fg);
  background:
    radial-gradient(120% 100% at 100% 0%, var(--shine), transparent 62%),
    linear-gradient(150deg, var(--from), var(--to));
  border: 1px solid var(--line);
  border-radius: 28px;
  box-shadow: var(--shadow);
  transition: box-shadow 0.3s ease;
}
.result[data-state="ready"] {
  --from: var(--ready-from);
  --to: var(--ready-to);
  --shine: rgba(255, 255, 255, 0.28);
  color: var(--on-solid);
  border-color: transparent;
  box-shadow: 0 18px 34px -16px var(--ready-glow);
  animation: pop 0.3s ease;
}
@keyframes pop { from { transform: scale(0.98); } to { transform: scale(1); } }
.status {
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px 5px 6px;
  border-radius: 999px;
  background: var(--field);
  font-size: 0.9375rem;
  font-weight: 600;
}
.result[data-state="ready"] .status { background: rgba(0, 0, 0, 0.22); }
.badge {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--muted);
  color: var(--bg);
  font-size: 0.8125rem;
  font-weight: 700;
  line-height: 1;
}
.result[data-state="ready"] .badge { background: #ffffff; color: var(--ready-to); }
.big {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0 0.18em;
  font-size: clamp(3.25rem, 19vw, 4.5rem);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.result[data-state="idle"] .big { color: var(--muted); }
.unit { font-size: 0.4em; font-weight: 600; letter-spacing: -0.01em; opacity: 0.85; }

/* Scale */

/* Clear */
.clear {
  grid-area: clear;
  font: inherit;
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--accent);
  background: var(--surface);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 18px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.12s ease;
}
.clear:active { transform: scale(0.96); }
.clear:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .field, .result, .clear { transition: none; }
  .result[data-state] { animation: none; }
}
</style>
</head>
<body>
<main class="wrap">
  <h1>Lipid Calculator</h1>

  <form id="form" class="inputs" novalidate>
    <div class="field">
      <label for="orig">Original level</label>
      <input id="orig" name="orig" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0.0">
    </div>
  </form>

  <section class="result" id="result" data-state="idle" aria-live="polite">
    <div class="status"><span class="badge" id="badge" aria-hidden="true">–</span><span id="status">Enter the original level</span></div>
    <div class="big"><span id="bigNum">–</span><span class="unit" id="unit" hidden>or lower</span></div>
  </section>

  <button type="button" id="clear" class="clear">Clear</button>
</main>

<script>
// calc-start
function parseLevel(s) {
  var t = String(s == null ? "" : s).trim().replace(",", ".");
  if (t === "" || !/^\d*\.?\d+$|^\d+\.$/.test(t)) return NaN;
  return parseFloat(t);
}
function calc(orig) {
  if (!isFinite(orig) || orig <= 0) return null;
  return { target: orig * 0.6, drop: orig * 0.4 };
}
// calc-end

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var elOrig = $("orig");
  var result = $("result");

  function fmt(n) {
    return n.toLocaleString("en-GB", { maximumFractionDigits: 2 });
  }
  function floor2(n) { return Math.floor(n * 100 + 1e-9) / 100; }

  function setState(state) {
    result.setAttribute("data-state", state);
  }

  function idle(label) {
    setState("idle");
    $("badge").textContent = "–";
    $("status").textContent = label;
    $("bigNum").textContent = "–";
    $("unit").hidden = true;
  }

  function update() {
    if (elOrig.value.trim() === "") { idle("Enter the original level"); return; }
    var o = parseLevel(elOrig.value);
    if (isNaN(o)) { idle("Enter numbers only"); return; }
    var r = calc(o);
    if (!r) { idle("Level must be above 0"); return; }

    setState("ready");
    $("badge").textContent = "↓";
    $("status").textContent = "Target for a 40% drop";
    $("bigNum").textContent = fmt(floor2(r.target));
    $("unit").hidden = false;
  }

  elOrig.addEventListener("input", update);
  elOrig.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); elOrig.blur(); }
  });
  $("form").addEventListener("submit", function (e) { e.preventDefault(); update(); });
  $("clear").addEventListener("click", function () {
    elOrig.value = ""; update(); elOrig.focus();
  });
  update();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/lipids-sw.js", { scope: "/lipids" }).catch(function () {});
  });
}
</script>
</body>
</html>
