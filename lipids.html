<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lipid Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lipids">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1515" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: one narrow column, phone first. Inputs on top, a single large pass/fail panel, then a scaled bar showing where the current level sits against the 40% target. */
:root {
  --bg: #f1f5f5;
  --surface: #ffffff;
  --fg: #12201f;
  --muted: #4f6564;
  --line: #cfdcdb;
  --accent: #0e5a62;
  --idle-bg: #e6eded;
  --good-bg: #dcf2e2;
  --good-fg: #09562a;
  --good-solid: #1f8a46;
  --bad-bg: #fbe2df;
  --bad-fg: #8a1b12;
  --bad-solid: #c8372d;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1515;
    --surface: #152120;
    --fg: #e6f0ef;
    --muted: #9bb2b0;
    --line: #2b3d3b;
    --accent: #6cc5cd;
    --idle-bg: #1d2d2c;
    --good-bg: #12311d;
    --good-fg: #8fe0a9;
    --good-solid: #3fb96a;
    --bad-bg: #3b1916;
    --bad-fg: #ffb6ad;
    --bad-solid: #e5584c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1515;
  --surface: #152120;
  --fg: #e6f0ef;
  --muted: #9bb2b0;
  --line: #2b3d3b;
  --accent: #6cc5cd;
  --idle-bg: #1d2d2c;
  --good-bg: #12311d;
  --good-fg: #8fe0a9;
  --good-solid: #3fb96a;
  --bad-bg: #3b1916;
  --bad-fg: #ffb6ad;
  --bad-solid: #e5584c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 16px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap {
  width: 100%;
  max-width: 460px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
h1 {
  margin: 0;
  font-size: 1.5rem;
  line-height: 1.15;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
}
form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: grid; gap: 6px; min-width: 0; }
label {
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
input {
  width: 100%;
  min-width: 0;
  font-family: var(--font-num);
  font-size: 1.375rem;
  font-weight: 500;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-variant-numeric: tabular-nums;
}
input:focus-visible,
button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
button {
  font: inherit;
  font-size: 0.9375rem;
  font-weight: 500;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }

/* Result */
.result {
  border-radius: 10px;
  padding: 14px 16px;
  background: var(--idle-bg);
  color: var(--fg);
  display: grid;
  gap: 6px;
  border: 2px solid transparent;
}
.result[data-state="pass"] { background: var(--good-bg); color: var(--good-fg); border-color: var(--good-solid); }
.result[data-state="fail"] { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-solid); }
.status { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 600; }
.badge {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--muted);
  color: var(--surface);
  font-size: 1rem;
  line-height: 1;
}
.result[data-state="pass"] .badge { background: var(--good-solid); color: #fff; }
.result[data-state="fail"] .badge { background: var(--bad-solid); color: #fff; }
.big {
  font-family: var(--font-num);
  font-weight: 600;
  font-size: clamp(2.25rem, 12vw, 3rem);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.detail { margin: 0; text-wrap: pretty; }

/* Scale bar: original level is the full length */
.scale { display: grid; gap: 10px; }
.scale h2 {
  margin: 0;
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.track {
  position: relative;
  height: 22px;
  border-radius: 6px;
  background: var(--idle-bg);
  border: 1px solid var(--line);
}
.fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: 5px 0 0 5px;
  background: var(--muted);
  transition: width 0.25s ease;
}
.track[data-state="pass"] .fill { background: var(--good-solid); }
.track[data-state="fail"] .fill { background: var(--bad-solid); }
.tick {
  position: absolute;
  top: -5px;
  bottom: -5px;
  width: 0;
  border-left: 2px dashed var(--fg);
}
.tick.orig { border-left-style: solid; }
dl {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
dl div { min-width: 0; }
dt { font-size: 0.8125rem; color: var(--muted); }
dd {
  margin: 0;
  font-family: var(--font-num);
  font-size: 1.125rem;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.foot { margin: 0; font-size: 0.8125rem; color: var(--muted); text-wrap: pretty; }

@media (prefers-reduced-motion: reduce) {
  .fill { transition: none; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>Lipid Calculator</h1>
    <button type="button" id="clear">Clear</button>
  </header>

  <section class="card" aria-label="Levels">
    <form id="form" novalidate>
      <div class="field">
        <label for="orig">Original level</label>
        <input id="orig" name="orig" type="text" inputmode="decimal" autocomplete="off" placeholder="0.0">
      </div>
      <div class="field">
        <label for="curr">Current level</label>
        <input id="curr" name="curr" type="text" inputmode="decimal" autocomplete="off" placeholder="0.0">
      </div>
    </form>
  </section>

  <section class="result" id="result" data-state="idle" aria-live="polite">
    <div class="status"><span class="badge" id="badge" aria-hidden="true">–</span><span id="status">Enter both levels</span></div>
    <div class="big" id="big">–</div>
  </section>

  <section class="card scale" aria-label="Scale">
    <h2>Where the current level sits</h2>
    <div class="track" id="track" data-state="idle">
      <div class="fill" id="fill"></div>
      <div class="tick" id="tickTarget" style="left:60%"></div>
      <div class="tick orig" id="tickOrig" style="left:100%"></div>
    </div>
    <dl>
      <div><dt>Current</dt><dd id="vCurr">–</dd></div>
      <div><dt>Target, or lower</dt><dd id="vTarget">–</dd></div>
      <div><dt>Original</dt><dd id="vOrig">–</dd></div>
    </dl>
  </section>

</main>

<script>
// calc-start
function parseLevel(s) {
  var t = String(s == null ? "" : s).trim().replace(",", ".");
  if (t === "" || !/^\d*\.?\d+$|^\d+\.$/.test(t)) return NaN;
  return parseFloat(t);
}
function calc(orig, curr) {
  if (!isFinite(orig) || !isFinite(curr) || orig <= 0 || curr < 0) return null;
  var dropPct = (orig - curr) / orig * 100;
  var target = orig * 0.6;
  var met = curr <= target + 1e-9;
  return { dropPct: dropPct, target: target, met: met };
}
// calc-end

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var elOrig = $("orig"), elCurr = $("curr");
  var result = $("result"), track = $("track");

  function fmt(n) {
    return n.toLocaleString("en-GB", { maximumFractionDigits: 2 });
  }
  function floor2(n) { return Math.floor(n * 100 + 1e-9) / 100; }
  function trunc1(n) { return Math.floor(Math.abs(n) * 10 + 1e-9) / 10; }

  function setState(state) {
    result.setAttribute("data-state", state);
    track.setAttribute("data-state", state);
  }

  function idle(message) {
    setState("idle");
    $("badge").textContent = "–";
    $("status").textContent = "Enter both levels";
    $("big").textContent = "–";
    $("fill").style.width = "0";
    $("tickTarget").style.left = "60%";
    $("tickOrig").style.left = "100%";
    $("vCurr").textContent = "–";
    $("vTarget").textContent = "–";
    $("vOrig").textContent = "–";
  }

  function update() {
    var o = parseLevel(elOrig.value), c = parseLevel(elCurr.value);
    var emptyO = elOrig.value.trim() === "", emptyC = elCurr.value.trim() === "";
    if (emptyO || emptyC) { idle("The result appears here as soon as both levels are filled in."); return; }
    if (isNaN(o) || isNaN(c)) { idle("Use numbers only, for example 5.8 or 3.2."); return; }
    var r = calc(o, c);
    if (!r) { idle("The original level must be greater than zero."); return; }

    var up = r.dropPct < 0;
    var pct = trunc1(r.dropPct);
    var dir = up ? "Up" : "Down";
    setState(r.met ? "pass" : "fail");
    $("badge").textContent = r.met ? "✓" : "✕";
    $("status").textContent = r.met ? "Target met" : "Target not met";
    $("big").textContent = (up ? "+" : "−") + fmt(pct) + "%";
    if (r.dropPct === 0) $("big").textContent = "0%";

    var max = Math.max(o, c);
    $("fill").style.width = (c / max * 100) + "%";
    $("tickTarget").style.left = (r.target / max * 100) + "%";
    $("tickOrig").style.left = (o / max * 100) + "%";
    $("vCurr").textContent = fmt(c);
    $("vTarget").textContent = fmt(floor2(r.target));
    $("vOrig").textContent = fmt(o);
  }

  elOrig.addEventListener("input", update);
  elCurr.addEventListener("input", update);
  $("form").addEventListener("submit", function (e) { e.preventDefault(); update(); });
  $("clear").addEventListener("click", function () {
    elOrig.value = ""; elCurr.value = ""; update(); elOrig.focus();
  });
  update();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
