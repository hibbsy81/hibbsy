<style>
/* Layout: tabbed study desk. Explore = short-form periodic table (groups 1-2, 13-18) beside a detail panel that builds the atom one electron at a time. */
:root{
  --bg:#EBEFF3; --surface:#FFFFFF; --surface-2:#E1E7ED; --ink:#14202C; --ink-2:#4A5967; --line:#C8D1DA;
  --accent:#C8431B; --accent-ink:#FFFFFF;
  --core:#2563A8; --val:#C2410C;
  --good:#1E7A4C; --bad:#B3261E;
  --tl:.93; --tc:.055; --tfl:.3; --tfc:.1; --tbl:.8; --tbc:.09;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#16202A; --surface-2:#1F2B37; --ink:#E8EEF3; --ink-2:#9DAEBD; --line:#2C3B49;
  --accent:#FF7A4D; --accent-ink:#1A0D07; --core:#7FB1EE; --val:#FF9A6B; --good:#5CD39A; --bad:#FF8A80;
  --tl:.3; --tc:.06; --tfl:.9; --tfc:.08; --tbl:.45; --tbc:.09; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#16202A; --surface-2:#1F2B37; --ink:#E8EEF3; --ink-2:#9DAEBD; --line:#2C3B49;
  --accent:#FF7A4D; --accent-ink:#1A0D07; --core:#7FB1EE; --val:#FF9A6B; --good:#5CD39A; --bad:#FF8A80;
  --tl:.3; --tc:.06; --tfl:.9; --tfc:.08; --tbl:.45; --tbc:.09; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,6vw,3.2rem);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0}
p{margin:0}
.lede{color:var(--ink-2);max-width:56ch}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600}

header{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tab{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.4;cursor:default}
.btn.sq{padding:7px 12px;min-width:40px}

/* configuration typography */
.cfg{font-family:var(--f-mono);font-weight:500}
.sub{display:inline-block;margin-right:.5em;white-space:nowrap}
.sub sup{font-size:.64em;vertical-align:.55em;line-height:0;color:var(--ink-2);margin-left:1px}
.sub.val{color:var(--val)} .sub.val sup{color:var(--val)}
.core-br{color:var(--ink-2);margin-right:.5em}

/* ---------- Explore ---------- */
.explore{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:880px){.explore{grid-template-columns:minmax(0,430px) minmax(0,1fr)}}
.ptable{display:grid;grid-template-columns:20px repeat(2,minmax(0,1fr)) 12px repeat(6,minmax(0,1fr));gap:4px;align-items:stretch}
.gh,.ph{font-size:.7rem;color:var(--ink-2);text-align:center;font-variant-numeric:tabular-nums;align-self:center}
.ph{align-self:center}
.gap{grid-column:4;grid-row:2/6;border-left:1.5px dashed var(--line);margin-left:5px}
.pnote{grid-row:5;grid-column:5/11;font-size:.78rem;color:var(--ink-2);display:flex;align-items:center;padding-left:6px}
.tile{--cm:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;aspect-ratio:1/1.1;padding:3px 2px 4px;
  background:oklch(var(--tl) calc(var(--tc)*var(--cm)) var(--h));color:oklch(var(--tfl) calc(var(--tfc)*var(--cm)) var(--h));
  border:1.5px solid oklch(var(--tbl) calc(var(--tbc)*var(--cm)) var(--h));border-radius:6px;cursor:pointer;min-width:0;transition:opacity .15s}
.tile .z{align-self:flex-start;font-size:.62rem;line-height:1;padding-left:2px;font-variant-numeric:tabular-nums}
.tile .sy{font-family:var(--f-display);font-weight:800;font-size:1.3rem;line-height:1}
.tile .nm{font-size:.56rem;line-height:1;opacity:.85;display:none;max-width:100%;overflow:hidden}
.tile[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.tile.dim{opacity:.28}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{--cm:1;font-size:.74rem;padding:3px 9px;border-radius:999px;cursor:pointer;
  background:oklch(var(--tl) calc(var(--tc)*var(--cm)) var(--h));color:oklch(var(--tfl) calc(var(--tfc)*var(--cm)) var(--h));
  border:1.5px solid oklch(var(--tbl) calc(var(--tbc)*var(--cm)) var(--h))}
.chip[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.caption{font-size:.8rem;color:var(--ink-2);margin-top:10px;max-width:52ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.ehead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bigtile{--cm:1;width:76px;height:84px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 4px;flex:none;
  background:oklch(var(--tl) calc(var(--tc)*var(--cm)) var(--h));color:oklch(var(--tfl) calc(var(--tfc)*var(--cm)) var(--h));
  border:1.5px solid oklch(var(--tbl) calc(var(--tbc)*var(--cm)) var(--h))}
.bigtile .z{align-self:flex-start;font-size:.8rem;line-height:1}
.bigtile .sy{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.bigtile .ms{font-size:.66rem;line-height:1;font-variant-numeric:tabular-nums}
.ehead h2{font-size:1.7rem}
.meta{color:var(--ink-2);font-size:.88rem}
.cfgbox{background:var(--surface-2);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cfgbox .full{font-size:clamp(1.15rem,3.6vw,1.5rem);line-height:1.45}
.cfgbox .short{font-size:.95rem;color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.88rem}
.stats b{font-variant-numeric:tabular-nums}
.fact{font-size:.92rem;color:var(--ink-2)}
.build{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:560px){.build{grid-template-columns:minmax(0,230px) minmax(0,1fr)}}
.bohr{width:100%;max-width:230px;height:auto;display:block;margin:0 auto}
.bohr .ring{fill:none;stroke:var(--line);stroke-width:1.2}
.bohr .nuc{fill:var(--ink)} .bohr .nt{fill:var(--bg);font:600 11px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.bohr .e-core{fill:var(--core)} .bohr .e-val{fill:var(--val)} .bohr .halo{fill:none;stroke:var(--accent);stroke-width:2}
.orbs{display:flex;flex-wrap:wrap;gap:14px 16px}
.sg{display:flex;flex-direction:column;align-items:center;gap:4px}
.boxes{display:flex}
.box{width:34px;height:38px;border:1.5px solid var(--ink-2);margin-left:-1.5px;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.boxes .box:first-child{margin-left:0}
.ar{font-style:normal;width:13px;font-size:1.2rem;font-weight:600;line-height:1;text-align:center;border-radius:3px}
.ar.core{color:var(--core)} .ar.val{color:var(--val)}
.ar.new{background:color-mix(in srgb,var(--accent) 22%,transparent);outline:1.5px solid var(--accent)}
.sg .lbl{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-2);margin-top:6px}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.stepper{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.stepbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stepbar input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.stepbar .count{font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:8.5em}
.hint{min-height:3em;font-size:.95rem}
.live{font-size:.95rem;color:var(--ink-2)}

/* ---------- Rules ---------- */
.rules{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:760px){.rules{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card p{color:var(--ink-2);font-size:.94rem}
.order{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.step:hover{border-color:var(--ink-2)}
.step .l{font-family:var(--f-mono);font-weight:600;font-size:1.25rem}
.step .l sup{font-size:.6em;color:var(--ink-2);vertical-align:.5em;line-height:0}
.step .r{font-size:.8rem;color:var(--ink-2)}
.read{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;font-family:var(--f-mono)}
.read .part{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-body);font-size:.78rem;color:var(--ink-2)}
.read .glyph{font-family:var(--f-mono);font-size:2rem;font-weight:600;color:var(--ink);line-height:1}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:.88rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.prog{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:6px;width:140px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* ---------- Cards ---------- */
.deck{display:flex;flex-direction:column;gap:16px;align-items:center}
.flip{width:100%;max-width:560px;height:270px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0}
.flip-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--surface-2)}
.face .q{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.face .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1}
.face .cfgbig{font-size:clamp(1.2rem,5vw,1.7rem);line-height:1.5}
.face .small{font-size:.9rem;color:var(--ink-2)}
.rate{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rate .btn.miss{border-color:var(--bad);color:var(--bad)}
.rate .btn.got{border-color:var(--good);color:var(--good)}
.keys{font-size:.78rem;color:var(--ink-2)}
kbd{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
.done{max-width:560px;width:100%;text-align:center;align-items:center}

/* ---------- Quiz ---------- */
.quiz{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.qtop{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qprompt{font-family:var(--f-display);font-weight:600;font-size:1.3rem;line-height:1.25;text-wrap:balance}
.qshow{background:var(--surface-2);border-radius:8px;padding:12px 14px;font-size:1.2rem;line-height:1.5}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--ink-2)}
.opt .k{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt .t{flex:1;min-width:0;font-size:1.02rem}
.opt .t.cfg{font-size:.98rem;line-height:1.5}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt:disabled{cursor:default;color:var(--ink)}
.why{padding:12px 14px;border-radius:8px;background:var(--surface-2);font-size:.93rem}
.why b.ok{color:var(--good)} .why b.no{color:var(--bad)}
.score{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1}
.missed{display:flex;flex-direction:column;gap:8px;text-align:left}
.missed div{padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:.9rem}

@media (prefers-reduced-motion:reduce){.flip-in,.bar>i,.tile{transition:none}}
</style>

function lastLoc(step){
  if(step<1)return null;var cum=0;
  for(var i=0;i<SUB.length;i++){if(step<=cum+SUB[i].cap){var j=step-cum-1,b=SUB[i].cap/2;return {i:i,j:j,box:j<b?j:j-b,up:j<b}}cum+=SUB[i].cap}
  return null;
}
function stepHint(step){
  if(step===0)return 'Only the nucleus so far. Press ▶ to add the first electron.';
  var L=lastLoc(step),s=SUB[L.i],lab=s.n+s.l,t;
  if(s.l==='s'){t=L.j===0?'Electron '+step+' goes into the '+lab+' orbital, spin up.':'Electron '+step+' pairs up in '+lab+' with opposite spin (Pauli exclusion principle: two electrons per orbital, never the same spin).'}
  else{t=L.j<3?'Hund’s rule: electron '+step+' takes an empty '+lab+' box. Every box gets one electron before any box gets two.':'All three '+lab+' boxes already hold one electron, so electron '+step+' pairs up with opposite spin.'}
  if(L.j===0&&s.l==='s'&&s.n>1)t+=' The inner shell is full, so a new shell begins.';
  if(step===19)t+=' Why 4s and not 3d? The 4s orbital sits lower in energy, so it fills first.';
  return t;
}
function bohr(step,maxShell){
  var c=fill(step),sh=[0,0,0,0];SUB.forEach(function(s,i){sh[s.n-1]+=c[i]});
  var top=0;sh.forEach(function(v,i){if(v>0)top=i+1});
  var L=lastLoc(step),lastShell=L?SUB[L.i].n-1:-1;
  var R=[26,50,74,98],slots=[2,8,8,2],order8=[0,4,2,6,1,5,3,7],order2=[0,1];
  var svg='<svg class="bohr" viewBox="0 0 220 220" role="img" aria-label="Bohr model with '+step+' electrons">';
  for(var n=0;n<maxShell;n++)svg+='<circle class="ring" cx="110" cy="110" r="'+R[n]+'"/>';
  svg+='<circle class="nuc" cx="110" cy="110" r="17"/><text class="nt" x="110" y="110">'+S.sel+'+</text>';
  for(n=0;n<4;n++){
    for(var k=0;k<sh[n];k++){
      var slot=(slots[n]===8?order8:order2)[k],ang=(-90+slot*360/slots[n]+(n%2?22.5:0))*Math.PI/180;
      var x=110+R[n]*Math.cos(ang),y=110+R[n]*Math.sin(ang);
      svg+='<circle class="'+(n+1===top?'e-val':'e-core')+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5.5"/>';
      if(n===lastShell&&k===sh[n]-1)svg+='<circle class="halo" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="10"/>';
    }
  }
  return svg+'</svg>';
}
function orbHTML(step,e){
  var c=fill(step),mn=maxNOf(c),L=lastLoc(step),out='';
  SUB.forEach(function(s,i){
    if(e.counts[i]===0)return;
    var b=s.cap/2,cnt=c[i],boxes='';
    for(var k=0;k<b;k++){
      var up=k<cnt,dn=cnt>b&&k<cnt-b,cls=(s.n===mn?'val':'core');
      var nu=L&&L.i===i&&L.box===k&&L.up,nd=L&&L.i===i&&L.box===k&&!L.up;
      boxes+='<span class="box">'+(up?'<i class="ar '+cls+(nu?' new':'')+'">↑</i>':'<i class="ar"></i>')+(dn?'<i class="ar '+cls+(nd?' new':'')+'">↓</i>':'<i class="ar"></i>')+'</span>';
    }
    out+='<div class="sg" role="group" aria-label="'+s.n+s.l+': '+cnt+' electrons"><div class="boxes">'+boxes+'</div><span class="lbl">'+s.n+s.l+'</span></div>';
  });
  return out;
}
function updateStep(){
  var e=E[S.sel-1],st=S.step,c=fill(st),pp=parts(c);

  $('#live').innerHTML=st?'So far: <span class="cfg">'+partsHTML(pp,maxNOf(c))+'</span>':'';
}

/* ---------- Rules ---------- */
function renderRules(){
  var ranges=[['1s','H, He',1],['2s','Li, Be',3],['2p','B to Ne',5],['3s','Na, Mg',11],['3p','Al to Ar',13],['4s','K, Ca',19]];
  var h='<div class="wrap" style="gap:18px"><section class="card"><h2>Electron shells</h2><p>Electrons move around the nucleus in shells. The first shell holds up to 2 electrons and the second holds up to 8. For these elements the third shell fills to 8 before a fourth shell starts. Fill the lowest shell first and write the numbers in order. Sodium has 11 electrons, so its electronic structure is 2, 8, 1.</p></section><section class="card"><h2>Extension: the fill order inside shells</h2>'
    +'<p>Electrons go into the lowest-energy subshell that still has room. For the first twenty elements the order is simple. Tap a step to see where it starts.</p>'
    +'<div class="order">'+ranges.map(function(r,i){var cap=SUB[i].cap;return '<button class="step" data-z="'+r[2]+'"><span class="l">'+r[0]+'<sup>'+cap+'</sup></span><span class="r">holds '+cap+' · '+r[1]+'</span></button>'}).join('')+'</div>'
    +'<p>Note that 4s fills before 3d, which is why potassium and calcium end in 4s.</p></section>';
  h+='<div class="rules">'
    +'<div class="card"><h3>Aufbau principle</h3><p>Build up from the lowest energy: 1s, 2s, 2p, 3s, 3p, 4s. Each subshell is filled before the next one starts.</p></div>'
    +'<div class="card"><h3>Pauli exclusion</h3><p>An orbital holds at most two electrons, and they must spin in opposite directions. That is why s holds 2 and p (three orbitals) holds 6.</p></div>'
    +'<div class="card"><h3>Hund’s rule</h3><p>Orbitals of equal energy, like the three 2p boxes, each get one electron before any pair up. Nitrogen has three unpaired 2p electrons; oxygen has two.</p></div></div>';
  h+='<section class="card"><h2>Extension: reading a configuration</h2><div class="read">'
    +'<div class="part"><span class="glyph">2</span>shell number</div><div class="part"><span class="glyph">p</span>subshell type</div><div class="part"><span class="glyph">4</span>electrons in it</div>'
    +'<div class="part"><span class="glyph" style="color:var(--val)">2p<sup style="font-size:.55em;vertical-align:.6em;line-height:0">4</sup></span>oxygen’s last subshell</div></div>'
    +'<p>Add up the small superscripts to get the atomic number. Oxygen: 2 + 2 + 4 = 8.</p></section>';
  h+='<div class="rules" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">'
    +'<div class="card"><h3>Period = number of shells</h3><p>Sodium has 3 shells (2, 8, 1), so it is in period 3. Potassium has 4 shells, so it is in period 4.</p></div>'
    +'<div class="card"><h3>Group = outer electrons</h3><p>The group number is the number of electrons in the outer shell. Sodium is in group 1 and has 1. Chlorine is in group 7 and has 7. Noble gases (group 0) have a full outer shell, so they are unreactive.</p></div>'
    +'<div class="card"><h3>Noble gas shorthand</h3><p>Replace the inner part with the previous noble gas in brackets. Sodium is [Ne] 3s¹ because neon is 1s² 2s² 2p⁶.</p></div></div></div>';
  $('#view').innerHTML=h;
}

var Q={qs:[],i:0,picked:null,score:0,missed:[],done:false};
function neighborsOf(z,span){var o=[];for(var d=-span;d<=span;d++){var t=z+d;if(d&&t>=1&&t<=20)o.push(E[t-1])}return o}
function mkCfg(z){
  var e=E[z-1],c=neighborsOf(z,3).map(function(n){return {key:'z'+n.z,html:cfgHTML(n)}}),ds;
  var odd=null;
  if(z===19)odd=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['3d',1]];
  if(z===20)odd=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['3d',2]];
  ds=pick(c,odd?2:3);if(odd)ds.push({key:'odd',html:wrongHTML(odd)});

    why:e.name+' has '+z+' electrons. Fill 1s, 2s, 2p, 3s, 3p, 4s in order until all '+z+' are placed: '+cfgText(e)+'.'+(z>=19?' The 4s subshell fills before 3d.':'')};

function mkEl(z){

function mkVal(z){

function mkShell(z){
  var e=E[z-1],txt=function(x){return x.shells.join(', ')},seen={},c=[];seen[txt(e)]=1;
  neighborsOf(z,4).forEach(function(n){if(!seen[txt(n)]){seen[txt(n)]=1;c.push(n)}});
  var o=shuffle([e].concat(pick(c,3)));
  return {prompt:'What is the electronic structure of a '+e.name+' atom?',opts:o.map(function(n){return {key:'t'+txt(n),html:txt(n)}}),correct:'t'+txt(e),
    why:'The first shell holds 2, the second holds 8, then the third fills. '+e.name+' has '+z+' electrons, which gives '+txt(e)+'.'};
}
function mkUnp(z){
  var e=E[z-1],L=e.last,b=SUB[L.i].cap/2;
  return {prompt:'How many unpaired electrons does a ground-state '+e.name+' atom have?',opts:[0,1,2,3].map(function(n){return {key:'n'+n,html:String(n)}}),correct:'n'+e.unp,
    why:'The last subshell, '+L.lab+', holds '+L.c+' electron'+(L.c>1?'s':'')+' across '+b+' box'+(b>1?'es':'')+'. Boxes fill singly first (Hund’s rule), so '+e.unp+' '+(e.unp===1?'is':'are')+' unpaired.'};

function mkSym(z){

 {prompt:'How many electrons can the second shell hold?',opts:['2','6','8','10'],correct:'8',why:'The second shell holds up to 8 electrons. Neon has a full second shell.'},
 {prompt:'Why are the noble gases, like neon and argon, unreactive?',opts:['They have a full outer shell','They have one electron in the outer shell','They have no electrons','They are very heavy'],correct:'They have a full outer shell',why:'A full outer shell is very stable, so noble gas atoms do not need to gain, lose or share electrons.'},
 {prompt:'Atoms of elements in the same group have the same number of what?',opts:['Shells','Electrons in the outer shell','Neutrons','Protons'],correct:'Electrons in the outer shell',why:'This is why elements in a group react in similar ways. Lithium, sodium and potassium all have 1 outer electron.'},
 {prompt:'Which particles move around the nucleus in shells?',opts:['Protons','Neutrons','Electrons','Ions'],correct:'Electrons',why:'Electrons are in shells around the nucleus. Protons and neutrons are inside it.'}
];
function mkElSh(z){
  var e=E[z-1],o=shuffle([e].concat(pick(neighborsOf(z,4),3)));
  return {prompt:'Which element has the electronic structure '+e.shells.join(', ')+'?',opts:o.map(function(n){return {key:'z'+n.z,html:n.name}}),correct:'z'+z,
    why:'Add the numbers: '+e.shells.join(' + ')+' = '+z+' electrons, so the atomic number is '+z+'. That is '+e.name+'.'};
}
function mkPeriod(z){
  var e=E[z-1];
  return {prompt:'Which period is '+e.name+' in?',opts:[1,2,3,4].map(function(n){return {key:'n'+n,html:'Period '+n}}),correct:'n'+e.period,
    why:e.name+' has '+e.shells.length+' shell'+(e.shells.length>1?'s':'')+' ('+e.shells.join(', ')+'), so it is in period '+e.period+'.'};
}
function mkGroup(z){
  var e=E[z-1],all=[1,2,3,4,5,6,7,0].filter(function(n){return n!==e.ukg}),o=shuffle([e.ukg].concat(pick(all,3)));
  return {prompt:'Which group is '+e.name+' in?',opts:o.map(function(n){return {key:'n'+n,html:'Group '+n}}),correct:'n'+e.ukg,
    why:e.ukg===0?e.name+' has a full outer shell, so it is a noble gas in group 0.':e.name+' has '+e.val+' electron'+(e.val>1?'s':'')+' in its outer shell, so it is in group '+e.ukg+'.'};
}
function mkTheory(){var TH=S.level==='ext'?THEORY_EXT:THEORY_Y9,t=TH[Math.floor(Math.random()*TH.length)];
  return {prompt:t.prompt,opts:shuffle(t.opts.map(function(o){return {key:o,html:o}})),correct:t.correct,why:t.why}}
function quizStart(){
  var pool=shuffle(poolZs().map(function(e){return e.z})),pi=0;
  function nz(){var z=pool[pi%pool.length];pi++;return z}
  var types=shuffle(S.level==='ext'?['cfg','cfg','cfg','el','el','outer','shell','unp','sym','theory']:['shell','shell','elsh','elsh','outer','outer','period','group','sym','theory']);
  Q.qs=types.map(function(t){switch(t){case 'elsh':return mkElSh(nz());case 'period':return mkPeriod(nz());case 'group':return mkGroup(nz());case 'outer':return mkVal(nz());case 'cfg':return mkCfg(nz());case 'el':return mkEl(nz());case 'val':return mkVal(nz());
    case 'shell':return mkShell(nz());case 'unp':return mkUnp(nz());case 'sym':return mkSym(nz());default:return mkTheory()}});
  Q.i=0;Q.picked=null;Q.score=0;Q.missed=[];Q.done=false;
}
function renderQuizTab(){
  $('#view').innerHTML='<div class="quiz"><div class="toolbar">'+levelSeg()+rangeSeg()+'</div><div id="qbody" class="quiz" style="margin:0"></div></div>';
  if(!Q.qs.length)quizStart();
  renderQuiz();
}
function plainOf(q,key){var o=q.opts.filter(function(x){return x.key===key})[0];return o?o:null}
function renderQuiz(){
  var b=$('#qbody');if(!b)return;
  if(Q.done){
    var best=+store.get('fte-best')||0;if(Q.score>best){best=Q.score;store.set('fte-best',String(best))}
    var msg=Q.score>=9?'Excellent. You know these atoms.':Q.score>=7?'Good work. A few to revisit.':Q.score>=5?'Getting there. Build the ones you missed in Explore.':'Keep going. The fill order is the key.';
    b.innerHTML='<div class="card" style="align-items:center;text-align:center;gap:12px"><span class="eyebrow">Result</span><div class="score">'+Q.score+'<span style="font-size:.4em;color:var(--ink-2)"> / '+Q.qs.length+'</span></div><p>'+msg+' Best score: '+best+'.</p>'
      +(Q.missed.length?'<div class="missed" style="width:100%"><h3>To review</h3>'+Q.missed.map(function(m){return '<div><b>'+m.prompt+'</b><br>'+m.why+'</div>'}).join('')+'</div>':'')
      +'<button class="btn primary" id="newquiz">New quiz</button></div>';
    return;
  }
  var q=Q.qs[Q.i],ans=Q.picked!==null;
  var h='<div class="qtop"><span>Question '+(Q.i+1)+' of '+Q.qs.length+'</span><span>Score '+Q.score+'</span></div>'
   +'<div class="bar" style="width:100%"><i style="width:'+(Q.i/Q.qs.length*100)+'%"></i></div>'
   +'<h2 class="qprompt">'+q.prompt+'</h2>'+(q.show?'<div class="qshow">'+q.show+'</div>':'')
   +'<div class="opts">'+q.opts.map(function(o,i){
      var cls='';if(ans){if(o.key===q.correct)cls=' ok';else if(o.key===Q.picked)cls=' no'}
      return '<button class="opt'+cls+'" data-key="'+String(o.key).replace(/"/g,'&quot;')+'"'+(ans?' disabled':'')+'><span class="k">'+(i+1)+'</span><span class="t'+(q.cfgOpts?' cfg':'')+'">'+o.html+'</span></button>'}).join('')+'</div>';
  if(ans){var ok=Q.picked===q.correct;
    h+='<div class="why"><b class="'+(ok?'ok':'no')+'">'+(ok?'Correct. ':'Not quite. ')+'</b>'+q.why+'</div>'
      +'<button class="btn primary" id="next" style="align-self:flex-start">'+(Q.i===Q.qs.length-1?'See result':'Next question')+'</button>';}
  b.innerHTML=h;
}
function quizPick(key){
  var q=Q.qs[Q.i];if(Q.picked!==null)return;
  Q.picked=key;if(key===q.correct)Q.score++;else Q.missed.push(q);
  renderQuiz();var n=$('#next');if(n)n.focus();
}
function quizNext(){if(Q.picked===null)return;if(Q.i===Q.qs.length-1)Q.done=true;else{Q.i++;Q.picked=null}renderQuiz()}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('button,.flip');if(!t)return;
  if(t.dataset.tab)return go(t.dataset.tab);
  if(t.classList.contains('tile'))return select(+t.dataset.z);
  if(t.classList.contains('chip')){S.filter=S.filter===t.dataset.cat?null:t.dataset.cat;
    document.querySelectorAll('.tile').forEach(function(x){x.classList.toggle('dim',!!S.filter&&E[+x.dataset.z-1].cat!==S.filter)});
    document.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',String(S.filter===x.dataset.cat))});return}
  if(t.classList.contains('step')){S.sel=+t.dataset.z;S.step=S.sel;S.tab='explore';renderTabs();renderExplore();window.scrollTo({top:0});return}
  var e=E[S.sel-1];
  if(t.id==='s0'){S.step=0;return updateStep()}
  if(t.id==='sm'){S.step=Math.max(0,S.step-1);return updateStep()}
  if(t.id==='sp'){S.step=Math.min(e.z,S.step+1);return updateStep()}
  if(t.id==='sf'){S.step=e.z;return updateStep()}
  if(t.dataset.level){S.level=t.dataset.level;quizStart();return renderQuizTab()}
  if(t.dataset.range){S.range=t.dataset.range;if(S.tab==='cards'){deckStart();renderCardsTab()}else{quizStart();renderQuizTab()}return}
  if(t.id==='flip'||t.id==='flipbtn')return cardFlip();
  if(t.id==='miss')return cardRate(false);
  if(t.id==='got')return cardRate(true);
  if(t.id==='again'){deckStart();return renderDeck()}
  if(t.classList.contains('opt'))return quizPick(t.dataset.key);
  if(t.id==='next')return quizNext();
  if(t.id==='newquiz'){quizStart();return renderQuiz()}
});
document.addEventListener('input',function(ev){if(ev.target.id==='sr'){S.step=+ev.target.value;updateStep()}});
document.addEventListener('change',function(ev){if(ev.target.id==='mode'){C.mode=ev.target.value;C.flipped=false;renderDeck()}});
document.addEventListener('keydown',function(ev){
  var tag=(ev.target.tagName||'').toLowerCase();if(tag==='select'||tag==='input')return;
  if(S.tab==='cards'){
    if(ev.key===' '&&tag!=='button'){ev.preventDefault();cardFlip()}
    else if(ev.key==='ArrowRight'){cardRate(true)}
    else if(ev.key==='ArrowLeft'){cardRate(false)}
  }else if(S.tab==='quiz'&&!Q.done){
    var q=Q.qs[Q.i];
    if(Q.picked===null&&/^[1-4]$/.test(ev.key)&&q.opts[+ev.key-1]){quizPick(q.opts[+ev.key-1].key)}
    else if(Q.picked!==null&&(ev.key==='ArrowRight')){quizNext()}
  }else if(S.tab==='explore'){
    var e=E[S.sel-1];
    if(ev.key==='ArrowRight'&&tag!=='button'){S.step=Math.min(e.z,S.step+1);updateStep()}
    else if(ev.key==='ArrowLeft'&&tag!=='button'){S.step=Math.max(0,S.step-1);updateStep()}
  }
});

renderTabs();render();
})();
</script>

</body></html>
