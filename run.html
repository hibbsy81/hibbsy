.hr .e{font-size:20px;line-height:1.5}.hr .t{font-weight:700;font-size:15px}.hr .m{color:var(--mu);font-size:11px}
.hr.best{border-color:var(--accent);box-shadow:0 0 16px color-mix(in srgb,var(--accent) 35%,transparent)}
@media (display-mode:standalone){nav.menu{display:none}}html.standalone nav.menu{display:none}

<body>
<main>
<header class="hero">
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#e9a35c"/><circle cx="47" cy="17" r="8" fill="#fff"/><circle cx="29" cy="19" r="4.5" fill="#1d2b3a"/><path d="M29 26l-2 14M29 30l-8 4M29 30l9 4M27 40l-8 10M27 40l10 5-2 9" stroke="#1d2b3a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  <div><h1>Run Light</h1><p>Is it light enough to run?</p></div>
</header>

<section class="card" id="srch">
  <div class="sw">
    <div class="sbox"><input id="q" type="search" placeholder="Search for a place" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Place"><button class="clr" id="clr" type="button" aria-label="Clear place" hidden><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></button></div>
    <ul class="res" id="res" hidden></ul>
  </div>

</section>

<section id="out" hidden>
  <div class="card">
    <div class="dnav">
      <button id="prev" type="button" aria-label="Previous day">&#8249;</button>
      <label class="dpick"><span id="dtxt"></span><input type="date" id="date" aria-label="Choose a date"></label>
      <button id="next" type="button" aria-label="Next day">&#8250;</button>

    </div>
    <div class="top">
      <div><div class="lbl">Running window</div><div class="big" id="win"></div><div class="mu" id="len"></div></div>
      <div class="sun"><div><span class="lbl">Sunrise</span><b id="sr"></b></div><div><span class="lbl">Sunset</span><b id="ss"></b></div></div>
    </div>

  </div>

  <div class="card" id="wxCard" hidden>
    <div class="lbl">Weather in your window</div>
    <div id="wxBody"></div>
  </div>

</section>
</main>

<script>
const $=id=>document.getElementById(id),R=Math.PI/180;
let place=null,results=[],seq=0,timer,wx=null,wxSig="";
try{place=JSON.parse(localStorage.getItem("rl-place"));}catch(e){}

/* NOAA solar position -> sun event times (UTC ms) */
function pos(jd){const T=(jd-2451545)/36525,s=x=>Math.sin(x*R),L0=(280.46646+T*(36000.76983+T*3.032e-4))%360,M=357.52911+T*(35999.05029-1.537e-4*T),
 e=.016708634-T*(4.2037e-5+1.267e-7*T),C=s(M)*(1.914602-T*(.004817+1.4e-5*T))+s(2*M)*(.019993-1.01e-4*T)+s(3*M)*2.89e-4,
 om=125.04-1934.136*T,lam=L0+C-.00569-.00478*s(om),
 eps=23+(26+(21.448-T*(46.815+T*(5.9e-4-T*1.813e-3)))/60)/60+.00256*Math.cos(om*R),
 dec=Math.asin(Math.sin(eps*R)*s(lam))/R,y=Math.tan(eps*R/2)**2,
 eq=4*(y*s(2*L0)-2*e*s(M)+4*e*y*s(M)*Math.cos(2*L0*R)-.5*y*y*s(4*L0)-1.25*e*e*s(2*M))/R;
 return{dec,eq};}
function ev(y,m,d,lat,lon,zen){
 const base=Date.UTC(y,m-1,d),jd=base/864e5+2440587.5;let noon=720-4*lon,p;
 for(let i=0;i<3;i++){p=pos(jd+noon/1440);noon=720-4*lon-p.eq;}
 const out={noon:base+noon*6e4};
 const h=t=>{const q=pos(jd+t/1440),c=(Math.cos(zen*R)-Math.sin(lat*R)*Math.sin(q.dec*R))/(Math.cos(lat*R)*Math.cos(q.dec*R));
  return c>1?null:c<-1?-1:Math.acos(c)/R*4;};
 const h0=h(noon);
 if(h0===null){out.st="none";return out;}if(h0===-1){out.st="all";return out;}
 let a=h0,b=h0;for(let i=0;i<2;i++){const ha=h(noon-a),hb=h(noon+b);if(ha>0)a=ha;if(hb>0)b=hb;}
 out.rise=base+(noon-a)*6e4;out.set=base+(noon+b)*6e4;return out;}
const day=(y,m,d,la,lo)=>({s:ev(y,m,d,la,lo,90.833),c:ev(y,m,d,la,lo,96)});

const tf=(ms,tz)=>new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(ms+3e4);
const mins=(ms,tz)=>{const[h,m]=tf(ms-3e4,tz).split(":");return+h*60+ +m;};
const dur=ms=>{const m=Math.round(ms/6e4);return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";};
const todayIn=tz=>new Intl.DateTimeFormat("en-CA",{timeZone:tz}).format(Date.now());
const show=(e,k,tz)=>e.st?(e.st==="all"?"All day":"None"):tf(e[k],tz);
function msg(t){$("msg").hidden=!t;$("msg").textContent=t||"";}

function render(){
 if(!place)return;
 const tz=place.tz,[y,m,d]=($("date").value||todayIn(tz)).split("-").map(Number);
 const r=day(y,m,d,place.lat,place.lon),w=r.c,bar=$("bar");
 $("out").hidden=false;
 {const tp=todayIn(tz).split("-").map(Number),df=Math.round((Date.UTC(y,m-1,d)-Date.UTC(tp[0],tp[1]-1,tp[2]))/864e5);
  $("dtxt").textContent=(df===0?"Today \u00b7 ":df===1?"Tomorrow \u00b7 ":df===-1?"Yesterday \u00b7 ":"")+new Intl.DateTimeFormat("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}).format(Date.UTC(y,m-1,d));
  $("today").hidden=df===0;}
 $("sr").textContent=show(r.s,"rise",tz);$("ss").textContent=show(r.s,"set",tz);
 if(w.st){$("win").textContent=w.st==="all"?"Light all day":"No usable light";$("len").textContent="";$("now").textContent="";bar.style.display="none";}
 else{
  $("win").textContent=tf(w.rise,tz)+" – "+tf(w.set,tz);$("len").textContent=dur(w.set-w.rise)+" of usable light";
  const P=x=>(mins(x,tz)/14.4).toFixed(2),N="var(--night)",T="var(--twi)",D="var(--day)";
  bar.style.display="";
  if(!r.s.st){const a=P(w.rise),b=P(r.s.rise),c=P(r.s.set),e=P(w.set);
   bar.style.background=`linear-gradient(90deg,${N} 0,${N} ${a}%,${T} ${a}%,${T} ${b}%,${D} ${b}%,${D} ${c}%,${T} ${c}%,${T} ${e}%,${N} ${e}%,${N} 100%)`;}
  else bar.style.background=D;
  const l=mins(w.rise,tz)/14.4,wd=Math.max(0,(mins(w.set,tz)-mins(w.rise,tz))/14.4);
  bar.innerHTML=`<div class="w" style="left:${l}%;width:${wd}%"></div>`;
  if($("date").value===todayIn(tz)){bar.insertAdjacentHTML("beforeend",`<div class="n" style="left:${mins(Date.now(),tz)/14.4}%"></div>`);
   const t=Date.now();$("now").textContent=t<w.rise?"Light in "+dur(w.rise-t):t<w.set?"Light now. "+dur(w.set-t)+" left.":"Dark now. Window has finished.";}
  else $("now").textContent="";
 }
 drawWx(w,tz);
}
/* Weather (Open-Meteo): temperature, rain, wind for the hours inside the window */
const WC={0:["\u2600\ufe0f","Clear"],1:["\ud83c\udf24\ufe0f","Mostly clear"],2:["\u26c5","Partly cloudy"],3:["\u2601\ufe0f","Overcast"],45:["\ud83c\udf2b\ufe0f","Fog"],48:["\ud83c\udf2b\ufe0f","Fog"],
 51:["\ud83c\udf26\ufe0f","Drizzle"],53:["\ud83c\udf26\ufe0f","Drizzle"],55:["\ud83c\udf27\ufe0f","Heavy drizzle"],56:["\ud83c\udf27\ufe0f","Freezing drizzle"],57:["\ud83c\udf27\ufe0f","Freezing drizzle"],
 61:["\ud83c\udf26\ufe0f","Light rain"],63:["\ud83c\udf27\ufe0f","Rain"],65:["\ud83c\udf27\ufe0f","Heavy rain"],66:["\ud83c\udf27\ufe0f","Freezing rain"],67:["\ud83c\udf27\ufe0f","Freezing rain"],
 71:["\ud83c\udf28\ufe0f","Light snow"],73:["\ud83c\udf28\ufe0f","Snow"],75:["\u2744\ufe0f","Heavy snow"],77:["\ud83c\udf28\ufe0f","Snow grains"],
 80:["\ud83c\udf26\ufe0f","Light showers"],81:["\ud83c\udf27\ufe0f","Showers"],82:["\ud83c\udf27\ufe0f","Heavy showers"],85:["\ud83c\udf28\ufe0f","Snow showers"],86:["\ud83c\udf28\ufe0f","Snow showers"],
 95:["\u26c8\ufe0f","Thunderstorm"],96:["\u26c8\ufe0f","Thunderstorm"],99:["\u26c8\ufe0f","Thunderstorm"]};
const wkey=()=>place.lat.toFixed(3)+","+place.lon.toFixed(3)+","+place.tz;
let wxBusy="";
function loadWx(){
 const key=wkey();
 if(wxBusy===key||(wx&&wx.key===key&&Date.now()-wx.at<18e5))return;
 wxBusy=key;
 fetch("https://api.open-meteo.com/v1/forecast?latitude="+place.lat+"&longitude="+place.lon+"&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,is_day&wind_speed_unit=kn&past_days=1&forecast_days=16&timezone="+encodeURIComponent(place.tz))
 .then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>{wx={key,at:Date.now(),j};}).catch(()=>{wx={key,at:Date.now(),err:true};})
 .finally(()=>{wxBusy="";wxSig="";render();});
}
function drawWx(w,tz){
 const card=$("wxCard"),body=$("wxBody");
 if(w.st){card.hidden=true;return;}
 card.hidden=false;
 loadWx();
 if(!wx||wx.key!==wkey()){wxSig="";body.innerHTML='<p class="hint">Loading weather\u2026</p>';return;}
 if(wx.err){wxSig="";body.innerHTML='<p class="hint">Couldn\u2019t load the weather just now.</p>';return;}
 const sig=wkey()+"|"+$("date").value+"|"+Math.round(w.rise/6e4)+"|"+wx.at;
 if(sig===wxSig)return;wxSig=sig;
 const H=wx.j.hourly,off=wx.j.utc_offset_seconds||0,all=[];
 for(let i=0;i<H.time.length;i++){
  const hh=+H.time[i].slice(11,13),[Y,M,D]=H.time[i].slice(0,10).split("-").map(Number),t=Date.UTC(Y,M-1,D,hh)-off*1e3;
  if(H.temperature_2m[i]!=null&&t+36e5>w.rise&&t<w.set)all.push({full:t>=w.rise&&t+36e5<=w.set,mid:t+18e5>w.rise&&t+18e5<w.set,lbl:H.time[i].slice(11,16),temp:H.temperature_2m[i],feel:H.apparent_temperature[i],pop:H.precipitation_probability[i]||0,pr:H.precipitation[i]||0,wind:H.wind_speed_10m[i],gust:H.wind_gusts_10m[i],code:H.weather_code[i],day:H.is_day[i]});
 }
 let hrs=all.filter(h=>h.full);if(!hrs.length)hrs=all.filter(h=>h.mid);
 if(!hrs.length){body.innerHTML='<p class="hint">No forecast available for this date.</p>';return;}
 const rd=Math.round,mn=k=>Math.min(...hrs.map(h=>h[k])),mx=k=>Math.max(...hrs.map(h=>h[k])),sum=k=>hrs.reduce((a,h)=>a+h[k],0);
 const worst=hrs.reduce((a,h)=>h.code>a.code?h:a,hrs[0]);
 const score=h=>h.pop*.6+h.pr*20+h.wind*1.4+Math.abs(h.feel-10)*2.5;
 const best=hrs.reduce((a,h)=>score(h)<score(a)?h:a,hrs[0]);
 const rng=(a,b)=>rd(a)===rd(b)?rd(a)+"\u00b0":rd(a)+"\u2013"+rd(b)+"\u00b0";
 const MOON='<path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7z" fill="#f3e3a4"/>',CLOUD='<path d="M8 20.5a4 4 0 0 1-.3-8 5.2 5.2 0 0 1 9.9-1.1A4.6 4.6 0 0 1 17.5 20.5z" fill="#c4cfdc"/>';
 const svg=b=>'<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="vertical-align:middle">'+b+'</svg>';
 const ico=h=>!h.day&&h.code<=1?svg(MOON+'<circle cx="19" cy="5" r="1.1" fill="#fff"/><circle cx="14.5" cy="2.8" r=".8" fill="#fff"/>'):!h.day&&h.code===2?svg('<g transform="translate(-3 -3) scale(.8)">'+MOON+'</g>'+CLOUD):(WC[h.code]||["",""])[0];
 body.innerHTML='<div class="stats">'+
  '<div><b>'+rng(mn("temp"),mx("temp"))+'C</b><small>Feels '+rng(mn("feel"),mx("feel"))+'</small></div>'+
  '<div><b>'+rd(mx("pop"))+'%</b><small>rain chance'+(sum("pr")>=.1?', '+sum("pr").toFixed(1)+' mm':'')+'</small></div>'+
  '<div><b>'+rd(sum("wind")/hrs.length)+' kts</b><small>gusts '+rd(mx("gust"))+'</small></div></div>'+
  '<p class="bestl">'+ico(worst)+' '+((WC[worst.code]||["","Mixed"])[1])+'. Best hour: '+best.lbl+' ('+rd(best.temp)+'\u00b0, '+best.pop+'% rain, '+rd(best.wind)+' kts)</p>'+
  '<div class="hrs">'+hrs.map(h=>'<div class="hr'+(h===best?' best':'')+'"><div class="m">'+h.lbl+'</div><div class="e">'+ico(h)+'</div><div class="t">'+rd(h.temp)+'\u00b0</div><div class="m">'+h.pop+'%</div><div class="m">'+rd(h.wind)+' kts</div></div>').join("")+'</div>'+
  '<p class="hint">Forecast by Open-Meteo.</p>';
}
function setPlace(p,keep){
 place=p;try{localStorage.setItem("rl-place",JSON.stringify(p));}catch(e){}
 if(!keep||!$("date").value)$("date").value=todayIn(p.tz);
 $("q").value=p.name;syncClr();msg("");render();
}

/* Search as you type */
function list(){
 const ul=$("res");ul.hidden=false;ul.innerHTML="";
 if(!results.length){ul.innerHTML='<li class="none">No places found</li>';return;}
 results.forEach(p=>{const li=document.createElement("li"),b=document.createElement("button");b.type="button";b.textContent=p.name;
  b.onclick=()=>pick(p);li.appendChild(b);ul.appendChild(li);});
}
function pick(p){clearTimeout(timer);seq++;$("res").hidden=true;setPlace(p);}
async function search(q){
 const my=++seq;
 try{
  const j=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&format=json&name="+encodeURIComponent(q))).json();
  if(my!==seq)return;
  results=(j.results||[]).map(x=>({name:[x.name,x.admin1,x.country].filter((v,i,a)=>v&&a.indexOf(v)===i).join(", "),lat:x.latitude,lon:x.longitude,tz:x.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone}));
  msg("");list();
 }catch(e){if(my===seq)msg("Couldn\u2019t search just now. Check your connection.");}
}
function syncClr(){$("clr").hidden=!$("q").value;}
$("clr").onclick=()=>{clearTimeout(timer);seq++;$("q").value="";results=[];$("res").hidden=true;syncClr();$("q").focus();};
$("q").addEventListener("input",()=>{
 syncClr();clearTimeout(timer);const q=$("q").value.trim();
 if(q.length<2){seq++;$("res").hidden=true;return;}
 timer=setTimeout(()=>search(q),250);
});
$("q").addEventListener("keydown",async e=>{
 if(e.key!=="Enter")return;e.preventDefault();clearTimeout(timer);
 const q=$("q").value.trim();if(q.length<2)return;
 if(!results.length||$("res").hidden)await search(q);
 if(results.length)pick(results[0]);
});

/* Use my location, then name the nearest place */
async function nearest(la,lo){
 try{
  const j=await(await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en&latitude="+la+"&longitude="+lo)).json();
  const n=j.locality||j.city;if(!n)return null;
  return [n,j.principalSubdivision].filter((v,i,a)=>v&&a.indexOf(v)===i).join(", ");
 }catch(e){return null;}
}
$("gps").onclick=()=>{
 if(!navigator.geolocation){msg("Location isn\u2019t available in this browser.");return;}
 msg("");$("gps").textContent="Locating\u2026";
 navigator.geolocation.getCurrentPosition(async p=>{
  $("res").hidden=true;seq++;
  const la=p.coords.latitude,lo=p.coords.longitude,tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  /* Show the new times straight away without touching the search box, so nothing flashes while the name is looked up */
  place={name:place?place.name:"",lat:la,lon:lo,tz};
  if(!$("date").value)$("date").value=todayIn(tz);
  render();
  const n=await nearest(la,lo);
  $("gps").textContent="Use my location";
  setPlace({name:n||"My location ("+la.toFixed(2)+", "+lo.toFixed(2)+")",lat:la,lon:lo,tz},true);
 },e=>{$("gps").textContent="Use my location";msg("Couldn\u2019t get your location: "+e.message);},{timeout:15000,maximumAge:6e5});
};
document.addEventListener("click",e=>{if(!e.target.closest(".card"))$("res").hidden=true;});
$("date").onchange=render;
function shift(n){if(!place)return;const[y,m,d]=($("date").value||todayIn(place.tz)).split("-").map(Number);$("date").value=new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10);render();}
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
$("date").addEventListener("click",()=>{try{$("date").showPicker();}catch(e){}});
$("today").onclick=()=>{if(place){$("date").value=todayIn(place.tz);render();}};
setInterval(()=>{if(place&&$("date").value===todayIn(place.tz))render();},6e4);
if(place)setPlace(place);
/* Home Screen icon: iOS saves the icon when the app is added, so a phone in dark mode gets the black-background version */
{const mq=matchMedia("(prefers-color-scheme: dark)"),ic=()=>document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(l=>l.href=mq.matches?"run-apple-touch-icon-dark.png":"run-apple-touch-icon.png");
 ic();if(mq.addEventListener)mq.addEventListener("change",ic);}
if(navigator.standalone||matchMedia("(display-mode: standalone)").matches)document.documentElement.classList.add("standalone");
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("run-sw.js").catch(()=>{}));
</script>
