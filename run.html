<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Run Light</title>
<meta name="description" content="Is it light enough to run? First light, last light, sunrise and sunset for any place.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e151e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="run.webmanifest">
<link rel="icon" href="run-favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="run-apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Run Light">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light dark;--bg:#F7F0E6;--glow:rgba(233,163,92,.38);--card:#fff;--ink:#1d2b3a;--mu:#6d6a62;--line:rgba(29,43,58,.12);--accent:#D9731A;--track:#C9502B;--night:#1d2b3a;--twi:#e9a35c;--day:#f6d56a;
--disp:"Barlow Condensed","Arial Narrow",Inter,sans-serif;
--menu-ink:var(--ink);--menu-accent:var(--accent);--menu-glass:rgba(255,255,255,.85);--menu-line:rgba(29,43,58,.12);--menu-hover:rgba(29,43,58,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0e151e;--glow:rgba(240,180,83,.14);--card:#17212e;--ink:#F3EEE6;--mu:#9aa3ad;--line:rgba(255,255,255,.10);--accent:#F0B453;--track:#9c3b22;--night:#0f1626;--twi:#c9803c;--day:#d9b94c;
--menu-glass:rgba(23,33,46,.82);--menu-line:rgba(255,255,255,.12);--menu-hover:rgba(255,255,255,.08)}}
*{box-sizing:border-box}[hidden]{display:none!important}
#out{display:grid;gap:14px}
body{margin:0;min-height:100dvh;background:var(--bg) radial-gradient(ellipse 90% 50% at 50% 0,var(--glow),transparent 70%) no-repeat;color:var(--ink);font:15px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;
padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;display:grid;gap:14px}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:18px 74px 32px 18px;border-radius:22px;background:var(--track);color:#fff}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 13px,rgba(255,255,255,.22) 13px 14px)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-conic-gradient(#fff 0 25%,#1d2b3a 0 50%) 0 0/12px 12px}
.hero>*{position:relative}
.logo{flex:none;width:54px;height:54px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
h1{margin:0;font:italic 800 40px/1 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.hero p{margin:3px 0 0;font-size:13px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--track);border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,button{font:inherit;color:inherit;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:8px 12px}
input{flex:1 1 200px;min-width:0;-webkit-appearance:none;appearance:none}
button{cursor:pointer;font-weight:600}
button.p{background:var(--accent);border-color:var(--accent);color:#1d2b3a}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.res{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.res button{width:100%;text-align:left;border:0;background:transparent;min-height:42px;font-weight:500;border-radius:10px}
.res button:hover,.res button:focus-visible{background:var(--bg)}
.res li.none{color:var(--mu);font-size:13px;padding:8px 12px}
.hint{color:var(--mu);font-size:13px;margin:8px 0 0}
.err{color:#d6453a}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.big{font:italic 800 48px/1.05 var(--disp);letter-spacing:.01em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.mu{color:var(--mu);font-size:13px}
.sun{display:flex;gap:28px;margin-top:12px}
.sun b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.now{font-weight:600;margin-top:12px}
.bar{position:relative;height:34px;border-radius:10px;margin-top:12px;overflow:hidden}
.bar .w{position:absolute;top:0;bottom:0;border:3px solid #fff;border-radius:8px;background:rgba(255,255,255,.12);box-shadow:0 0 0 1.5px #1d2b3a,inset 0 0 0 1.5px #1d2b3a}
.bar .n{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#ff3b30;box-shadow:0 0 0 1px #fff}
.tick{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border:0}
.wrap{overflow-x:auto}
@media (display-mode:standalone){nav.menu{display:none}}html.standalone nav.menu{display:none}
nav.menu{top:calc(24px + env(safe-area-inset-top,0px));right:calc(30px + env(safe-area-inset-right,0px))}
</style>
<script src="menu.js?v=17" defer></script>
</head>
<body>
<main>
<header class="hero">
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#e9a35c"/><circle cx="47" cy="17" r="8" fill="#fff"/><circle cx="29" cy="19" r="4.5" fill="#1d2b3a"/><path d="M29 26l-2 14M29 30l-8 4M29 30l9 4M27 40l-8 10M27 40l10 5-2 9" stroke="#1d2b3a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  <div><h1>Run Light</h1><p>Is it light enough to run?</p></div>
</header>

<section class="card">
  <div class="row">
    <input id="q" type="search" placeholder="Search for a place" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Place">
    <button class="p" id="gps" type="button">Use my location</button>
  </div>
  <ul class="res" id="res" hidden></ul>
  <p class="hint err" id="msg" role="status" hidden></p>
</section>

<section id="out" hidden>
  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <input type="date" id="date" aria-label="Date" style="flex:0 1 170px">
      <button id="today" type="button">Today</button>
    </div>
    <div class="lbl">Running window</div>
    <div class="big" id="win"></div>
    <div class="mu" id="len"></div>
    <div class="sun"><div><span class="lbl">Sunrise</span><b id="sr"></b></div><div><span class="lbl">Sunset</span><b id="ss"></b></div></div>
    <div class="now" id="now"></div>
    <div class="bar" id="bar"></div>
    <div class="tick"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
  </div>

  <div class="card wrap">
    <div class="lbl" style="margin-bottom:6px">Next 7 days</div>
    <table><thead><tr><th>Day</th><th>First</th><th>Rise</th><th>Set</th><th>Last</th><th>Window</th></tr></thead><tbody id="week"></tbody></table>
  </div>
  <p class="hint" style="text-align:center">The window runs from first light to last light (civil twilight, sun 6° below the horizon): bright enough to run without a head torch.</p>
</section>
</main>

<script>
const $=id=>document.getElementById(id),R=Math.PI/180;
let place=null,results=[],seq=0,timer;
try{place=JSON.parse(localStorage.getItem("rl-place"));}catch(e){}

/* NOAA solar position -> sun event times (UTC ms) */
function pos(jd){const T=(jd-2451545)/36525,s=x=>Math.sin(x*R),L0=(280.46646+T*(36000.76983+T*3.032e-4))%360,M=357.52911+T*(35999.05029-1.537e-4*T),
 e=.016708634-T*(4.2037e-5+1.267e-7*T),C=s(M)*(1.914602-T*(.004817+1.4e-5*T))+s(2*M)*(.019993-1.01e-4*T)+s(3*M)*2.89e-4,
 om=125.04-1934.136*T,lam=L0+C-.00569-.00478*s(om),
 eps=23+(26+(21.448-T*(46.815+T*(5.9e-4-T*1.813e-3)))/60)/60+.00256*Math.cos(om*R),
 dec=Math.asin(Math.sin(eps*R)*s(lam))/R,y=Math.tan(eps*R/2)**2,
 eq=4*(y*s(2*L0)-2*e*s(M)+4*e*y*s(M)*Math.cos(2*L0*R)-.5*y*y*s(4*L0)-1.25*e*e*s(2*M))/R;
 return{dec,eq};}
function ev(y,m,d,lat,lon,zen){
 const base=Date.UTC(y,m-1,d),jd=base/864e5+2440587.5;let noon=720-4*lon,p;
 for(let i=0;i<3;i++){p=pos(jd+noon/1440);noon=720-4*lon-p.eq;}
 const out={noon:base+noon*6e4};
 const h=t=>{const q=pos(jd+t/1440),c=(Math.cos(zen*R)-Math.sin(lat*R)*Math.sin(q.dec*R))/(Math.cos(lat*R)*Math.cos(q.dec*R));
  return c>1?null:c<-1?-1:Math.acos(c)/R*4;};
 const h0=h(noon);
 if(h0===null){out.st="none";return out;}if(h0===-1){out.st="all";return out;}
 let a=h0,b=h0;for(let i=0;i<2;i++){const ha=h(noon-a),hb=h(noon+b);if(ha>0)a=ha;if(hb>0)b=hb;}
 out.rise=base+(noon-a)*6e4;out.set=base+(noon+b)*6e4;return out;}
const day=(y,m,d,la,lo)=>({s:ev(y,m,d,la,lo,90.833),c:ev(y,m,d,la,lo,96)});

const tf=(ms,tz)=>new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(ms+3e4);
const mins=(ms,tz)=>{const[h,m]=tf(ms-3e4,tz).split(":");return+h*60+ +m;};
const dur=ms=>{const m=Math.round(ms/6e4);return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";};
const todayIn=tz=>new Intl.DateTimeFormat("en-CA",{timeZone:tz}).format(Date.now());
const show=(e,k,tz)=>e.st?(e.st==="all"?"All day":"None"):tf(e[k],tz);
function msg(t){$("msg").hidden=!t;$("msg").textContent=t||"";}

function render(){
 if(!place)return;
 const tz=place.tz,[y,m,d]=($("date").value||todayIn(tz)).split("-").map(Number);
 const r=day(y,m,d,place.lat,place.lon),w=r.c,bar=$("bar");
 $("out").hidden=false;
 $("sr").textContent=show(r.s,"rise",tz);$("ss").textContent=show(r.s,"set",tz);
 if(w.st){$("win").textContent=w.st==="all"?"Light all day":"No usable light";$("len").textContent="";$("now").textContent="";bar.style.display="none";}
 else{
  $("win").textContent=tf(w.rise,tz)+" – "+tf(w.set,tz);$("len").textContent=dur(w.set-w.rise)+" of usable light";
  const P=x=>(mins(x,tz)/14.4).toFixed(2),N="var(--night)",T="var(--twi)",D="var(--day)";
  bar.style.display="";
  if(!r.s.st){const a=P(w.rise),b=P(r.s.rise),c=P(r.s.set),e=P(w.set);
   bar.style.background=`linear-gradient(90deg,${N} 0,${N} ${a}%,${T} ${a}%,${T} ${b}%,${D} ${b}%,${D} ${c}%,${T} ${c}%,${T} ${e}%,${N} ${e}%,${N} 100%)`;}
  else bar.style.background=D;
  const l=mins(w.rise,tz)/14.4,wd=Math.max(0,(mins(w.set,tz)-mins(w.rise,tz))/14.4);
  bar.innerHTML=`<div class="w" style="left:${l}%;width:${wd}%"></div>`;
  if($("date").value===todayIn(tz)){bar.insertAdjacentHTML("beforeend",`<div class="n" style="left:${mins(Date.now(),tz)/14.4}%"></div>`);
   const t=Date.now();$("now").textContent=t<w.rise?"Light in "+dur(w.rise-t):t<w.set?"Light now. "+dur(w.set-t)+" left.":"Dark now. Window has finished.";}
  else $("now").textContent="";
 }
 let rows="";
 for(let i=0;i<7;i++){const dt=new Date(Date.UTC(y,m-1,d+i)),q=day(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate(),place.lat,place.lon);
  rows+=`<tr><td>${new Intl.DateTimeFormat("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}).format(dt)}</td><td>${show(q.c,"rise",tz)}</td><td>${show(q.s,"rise",tz)}</td><td>${show(q.s,"set",tz)}</td><td>${show(q.c,"set",tz)}</td><td>${q.c.st?"–":dur(q.c.set-q.c.rise)}</td></tr>`;}
 $("week").innerHTML=rows;
}
function setPlace(p,keep){
 place=p;try{localStorage.setItem("rl-place",JSON.stringify(p));}catch(e){}
 if(!keep||!$("date").value)$("date").value=todayIn(p.tz);
 $("q").value=p.name;msg("");render();
}

/* Search as you type */
function list(){
 const ul=$("res");ul.hidden=false;ul.innerHTML="";
 if(!results.length){ul.innerHTML='<li class="none">No places found</li>';return;}
 results.forEach(p=>{const li=document.createElement("li"),b=document.createElement("button");b.type="button";b.textContent=p.name;
  b.onclick=()=>pick(p);li.appendChild(b);ul.appendChild(li);});
}
function pick(p){clearTimeout(timer);seq++;$("res").hidden=true;setPlace(p);}
async function search(q){
 const my=++seq;
 try{
  const j=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&format=json&name="+encodeURIComponent(q))).json();
  if(my!==seq)return;
  results=(j.results||[]).map(x=>({name:[x.name,x.admin1,x.country].filter((v,i,a)=>v&&a.indexOf(v)===i).join(", "),lat:x.latitude,lon:x.longitude,tz:x.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone}));
  msg("");list();
 }catch(e){if(my===seq)msg("Couldn\u2019t search just now. Check your connection.");}
}
$("q").addEventListener("input",()=>{
 clearTimeout(timer);const q=$("q").value.trim();
 if(q.length<2){seq++;$("res").hidden=true;return;}
 timer=setTimeout(()=>search(q),250);
});
$("q").addEventListener("keydown",async e=>{
 if(e.key!=="Enter")return;e.preventDefault();clearTimeout(timer);
 const q=$("q").value.trim();if(q.length<2)return;
 if(!results.length||$("res").hidden)await search(q);
 if(results.length)pick(results[0]);
});

/* Use my location, then name the nearest place */
async function nearest(la,lo){
 try{
  const j=await(await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en&latitude="+la+"&longitude="+lo)).json();
  const n=j.locality||j.city;if(!n)return null;
  return [n,j.principalSubdivision].filter((v,i,a)=>v&&a.indexOf(v)===i).join(", ");
 }catch(e){return null;}
}
$("gps").onclick=()=>{
 if(!navigator.geolocation){msg("Location isn\u2019t available in this browser.");return;}
 msg("");$("gps").textContent="Locating\u2026";
 navigator.geolocation.getCurrentPosition(async p=>{
  $("gps").textContent="Use my location";$("res").hidden=true;seq++;
  const la=p.coords.latitude,lo=p.coords.longitude,tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  setPlace({name:"Finding place\u2026",lat:la,lon:lo,tz});
  const n=await nearest(la,lo);
  setPlace({name:n||"My location ("+la.toFixed(2)+", "+lo.toFixed(2)+")",lat:la,lon:lo,tz},true);
 },e=>{$("gps").textContent="Use my location";msg("Couldn\u2019t get your location: "+e.message);},{timeout:15000,maximumAge:6e5});
};
document.addEventListener("click",e=>{if(!e.target.closest(".card"))$("res").hidden=true;});
$("date").onchange=render;
$("today").onclick=()=>{if(place){$("date").value=todayIn(place.tz);render();}};
setInterval(()=>{if(place&&$("date").value===todayIn(place.tz))render();},6e4);
if(place)setPlace(place);
if(navigator.standalone||matchMedia("(display-mode: standalone)").matches)document.documentElement.classList.add("standalone");
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("run-sw.js").catch(()=>{}));
</script>
</body>
</html>
